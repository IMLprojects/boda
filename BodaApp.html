  const nPend = guests.filter((g) => !g.confirmado).length;
  const sinMesa = guests.filter((g) => !g.mesa).length;

  const addGuest = () => {
    if (!newG.n.trim()) return;
    setGuests([...guests, { ...newG, n: newG.n.trim(), mesa: newG.mesa ? +newG.mesa : null, id: "guest_" + Date.now() }]);
    setNewG({ n: "", sex: "Mujer", comida: "Adulto", desp: "Ninguna", mesa: "", confirmado: "" });
    setAdding(false);
  };
  const removeGuest = (id) => {
    if (confirm("¿Eliminar este invitado?")) setGuests(guests.filter((g) => g.id !== id));
  };
  const startEdit = (g) => { setEditing(g.id); setDraft({ ...g, mesa: g.mesa ?? "" }); };
  const saveEdit = () => {
    setGuests(guests.map((g) => g.id === editing ? { ...draft, mesa: draft.mesa ? +draft.mesa : null } : g));
    setEditing(null);
  };

  const mesaColor = (m) => m ? `hsl(${m * 27},60%,88%)` : "#eee";
  const setConf = (id, val) => setGuests(guests.map((g) => g.id === id ? { ...g, confirmado: val } : g));
  const setOrigen = (id, val) => setGuests(guests.map((g) => g.id === id ? { ...g, origen: val } : g));
  const nViaFormulario = guests.filter((g) => g.origen === "Formulario").length;

  const totalRSVP = guests.length;
  const pctResp = Math.round(((nSi + nNo) / totalRSVP) * 100);

  return (
    <div>
      {/* Panel RSVP */}
      <Card style={{ marginBottom: 14, background: C.tealLight, borderColor: "rgba(26,143,106,.2)" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10, marginBottom: 10 }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: C.teal }}>Estado de confirmaciones (RSVP)</div>
          <div style={{ fontSize: 12, color: C.sub }}>Fecha límite para confirmar al catering: <strong>2 octubre 2026</strong></div>
        </div>
        <div style={{ height: 22, background: "#fff", borderRadius: 11, overflow: "hidden", display: "flex", marginBottom: 8 }}>
          <div style={{ width: (nSi / totalRSVP * 100) + "%", background: C.green }} title={`Confirmados ${nSi}`} />
          <div style={{ width: (nNo / totalRSVP * 100) + "%", background: C.red }} title={`No vienen ${nNo}`} />
          <div style={{ width: (nPend / totalRSVP * 100) + "%", background: C.grayMid }} title={`Pendientes ${nPend}`} />
        </div>
        <div style={{ display: "flex", gap: 18, flexWrap: "wrap", fontSize: 12, color: C.sub }}>
          <span><strong style={{ color: C.green }}>{nSi}</strong> confirmados</span>
          <span><strong style={{ color: C.red }}>{nNo}</strong> no vienen</span>
          <span><strong style={{ color: C.text }}>{nPend}</strong> pendientes de responder</span>
          <span style={{ marginLeft: "auto" }}>{pctResp}% ha respondido</span>
        </div>
        {nPend > 0 && (
          <div style={{ marginTop: 8 }}>
            <Btn small variant="teal" onClick={() => { setFConf("PEND"); }}>Ver los {nPend} pendientes →</Btn>
          </div>
        )}
      </Card>

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
        <Badge color="gray">{guests.length} total</Badge>
        <Badge color="green">{nSi} confirmados</Badge>
        <Badge color="red">{nNo} no vienen</Badge>
        <Badge color="gray">{nPend} pendientes</Badge>
        <Badge color="blue">{nH} hombres</Badge>
        <Badge color="rose">{nM} mujeres</Badge>
        <Badge color="amber">{nNinos} niños</Badge>
        <Badge color="red">{nRestr} con restricción</Badge>
        {sinMesa > 0 && <Badge color="purple">{sinMesa} sin mesa</Badge>}
        {familias.length > 0 && <Badge color="purple">{familias.length} familias definidas</Badge>}
        {nConRegalo > 0 && <Badge color="rose">🎁 {nConRegalo} con regalo</Badge>}
        <div style={{ flex: 1 }} />
        <Btn small variant={gestionandoFamilias ? "primary" : "default"} onClick={() => setGestionandoFamilias(!gestionandoFamilias)}>
          👪 {gestionandoFamilias ? "Cerrar gestión de familias" : "Gestionar familias"}
        </Btn>
      </div>

      {familiasRepartidas.length > 0 && (
        <Card style={{ marginBottom: 14, background: C.amberLight, border: `1px solid ${C.amber}33` }}>
          <div style={{ fontSize: 13, color: C.amber }}>
            <strong>💡 {familiasRepartidas.length} familia{familiasRepartidas.length > 1 ? "s" : ""} repartida{familiasRepartidas.length > 1 ? "s" : ""} en varias mesas:</strong>{" "}
            {familiasRepartidas.map((f) => familiaLabel(familias, f)).join(" · ")}. Revísalo en la pestaña <strong>Mesas</strong> si quieres sentarlos juntos.
          </div>
        </Card>
      )}

      {gestionandoFamilias && (
        <Card style={{ marginBottom: 14, background: C.rosePale }} title="Gestionar familias">
          <div style={{ marginBottom: 16, padding: 12, background: C.card, borderRadius: 10, border: `1px solid ${C.border}` }}>
            <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 8 }}>Nueva familia</div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginBottom: 8 }}>
              <Input placeholder="Nombre de la nueva familia (ej. Primos de Marga)" value={nuevaFamilia} onChange={setNuevaFamilia} style={{ flex: 1, minWidth: 220 }} />
              <Btn variant="primary" onClick={crearFamilia} disabled={!nuevaFamilia.trim()}>+ Crear familia{nuevaFamiliaMiembros.length > 0 ? ` con ${nuevaFamiliaMiembros.length}` : ""}</Btn>
            </div>
            {nuevaFamiliaMiembros.length > 0 && (
              <div style={{ display: "flex", flexWrap: "wrap", gap: 4, marginBottom: 8 }}>
                {nuevaFamiliaMiembros.map((id) => {
                  const g = guests.find((x) => x.id === id);
                  if (!g) return null;
                  return (
                    <span key={id} style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 11, background: C.roseLight, color: C.rose, padding: "3px 8px", borderRadius: 20 }}>
                      {g.n}
                      <span style={{ cursor: "pointer", fontWeight: 700 }} onClick={() => toggleNuevaFamiliaMiembro(id)}>✕</span>
                    </span>
                  );
                })}
              </div>
            )}
            <Input placeholder="🔍 Buscar invitados para añadir a esta familia…" value={nuevaFamiliaQuery} onChange={setNuevaFamiliaQuery} style={{ width: "100%", marginBottom: 6 }} />
            {nuevaFamiliaQuery.trim() && (
              <div style={{ maxHeight: 160, overflowY: "auto", border: `1px solid ${C.grayMid}`, borderRadius: 8 }}>
                {guests.filter((g) => g.n.toLowerCase().includes(nuevaFamiliaQuery.toLowerCase())).slice(0, 30).map((g) => {
                  const selected = nuevaFamiliaMiembros.includes(g.id);
                  const otraFamilia = g.familia && familiaLabel(familias, g.familia);
                  return (
                    <div
                      key={g.id}
                      onClick={() => toggleNuevaFamiliaMiembro(g.id)}
                      style={{ display: "flex", justifyContent: "space-between", padding: "6px 10px", fontSize: 12, cursor: "pointer", background: selected ? C.roseLight : "transparent", borderBottom: `1px solid ${C.grayLight}` }}
                    >
                      <span>{selected ? "✓ " : ""}{g.n}</span>
                      {otraFamilia && <span style={{ color: C.sub, fontSize: 11 }}>ya en {otraFamilia}</span>}
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {familias.length === 0 ? (
            <div style={{ fontSize: 12, color: C.sub }}>Todavía no hay familias creadas.</div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {familias.map((f) => {
                const miembros = miembrosDe(f.id);
                const isEdFam = editingFamilia === f.id;
                const isAddingMember = addingMemberTo === f.id;
                return (
                  <div key={f.id} data-familia-id={f.id} style={{ display: "flex", alignItems: "flex-start", gap: 10, padding: "8px 10px", background: C.card, borderRadius: 10, border: `1px solid ${C.border}` }}>
                    <span style={{ width: 14, height: 14, borderRadius: "50%", background: familiaColor(f.id), flexShrink: 0, marginTop: 3 }} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      {isEdFam ? (
                        <div style={{ display: "flex", gap: 6, marginBottom: 4 }}>
                          <Input value={draftFamiliaNombre} onChange={setDraftFamiliaNombre} style={{ flex: 1 }} />
                          <Btn small variant="primary" onClick={saveEditFamilia}>✓</Btn>
                          <Btn small variant="ghost" onClick={() => setEditingFamilia(null)}>✕</Btn>
                        </div>
                      ) : (
                        <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 4 }}>{f.nombre}</div>
                      )}

                      <div style={{ display: "flex", flexWrap: "wrap", gap: 4, marginBottom: 6 }}>
                        {miembros.length === 0 && <span style={{ fontSize: 11, color: C.sub, fontStyle: "italic" }}>Sin miembros todavía</span>}
                        {miembros.map((m) => (
                          <span key={m.id} style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 11, background: C.grayLight, padding: "3px 8px", borderRadius: 20 }}>
                            {m.n}
                            <span style={{ cursor: "pointer", fontWeight: 700, color: C.sub }} onClick={() => quitarDeFamilia(m.id)} title="Quitar de la familia">✕</span>
                          </span>
                        ))}
                      </div>

                      {isAddingMember ? (
                        <div style={{ maxWidth: 320 }}>
                          <Input placeholder="🔍 Buscar invitado para añadir…" value={memberQuery} onChange={setMemberQuery} style={{ width: "100%", marginBottom: 4 }} />
                          {memberQuery.trim() && (
                            <div style={{ maxHeight: 140, overflowY: "auto", border: `1px solid ${C.grayMid}`, borderRadius: 8 }}>
                              {guests.filter((g) => g.familia !== f.id && g.n.toLowerCase().includes(memberQuery.toLowerCase())).slice(0, 30).map((g) => {
                                const otraFamilia = g.familia && familiaLabel(familias, g.familia);
                                return (
                                  <div
                                    key={g.id}
                                    onClick={() => { asignarFamilia(g.id, f.id); setMemberQuery(""); }}
                                    style={{ display: "flex", justifyContent: "space-between", padding: "6px 10px", fontSize: 12, cursor: "pointer", borderBottom: `1px solid ${C.grayLight}` }}
                                  >
                                    <span>{g.n}</span>
                                    {otraFamilia && <span style={{ color: C.amber, fontSize: 11 }}>mover desde {otraFamilia}</span>}
                                  </div>
                                );
                              })}
                            </div>
                          )}
                          <Btn small variant="ghost" onClick={() => { setAddingMemberTo(null); setMemberQuery(""); }} style={{ marginTop: 4 }}>Cerrar</Btn>
                        </div>
                      ) : (
                        !isEdFam && <Btn small variant="ghost" onClick={() => { setAddingMemberTo(f.id); setMemberQuery(""); }}>+ Añadir miembro</Btn>
                      )}
                    </div>
                    {!isEdFam && !isAddingMember && (
                      <div style={{ display: "flex", gap: 4, flexShrink: 0 }}>
                        <Btn small variant="ghost" onClick={() => startEditFamilia(f)}>✏️</Btn>
                        <Btn small variant="danger" onClick={() => eliminarFamilia(f.id)}>🗑</Btn>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
          <div style={{ fontSize: 11, color: C.sub, marginTop: 10 }}>
            💡 También puedes asignar o quitar la familia de un invitado editándolo (✏️) en la tabla de abajo.
          </div>
        </Card>
      )}

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
        <Input placeholder="🔍 Buscar…" value={q} onChange={setQ} style={{ flex: 1, minWidth: 140 }} />
        <Select value={fConf} onChange={setFConf} options={[{ value: "", label: "Confirmación" }, { value: "Si", label: "Confirmados" }, { value: "No", label: "No vienen" }, { value: "PEND", label: "Pendientes" }]} />
        <Select value={fMesa} onChange={setFMesa} options={[{ value: "", label: "Todas las mesas" }, ...mesas.map((m) => ({ value: String(m), label: "Mesa " + m }))]} />
        <Select value={fCom} onChange={setFCom} options={[{ value: "", label: "Todos los menús" }, ...menusEnUso.map((m) => ({ value: m, label: m }))]} />
        <Select value={fDesp} onChange={setFDesp} options={[{ value: "", label: "Todas las despedidas" }, "Marga", "Iván", "Ninguna"]} />
        <SelectBuscable value={fFam} onChange={setFFam} placeholder="Todas las familias" options={[{ value: "", label: "Todas las familias" }, ...familiasEnUso.map((f) => ({ value: f, label: familiaLabel(familias, f) }))]} style={{ width: 170 }} />
        <Select value={fOrigen} onChange={setFOrigen} options={[{ value: "", label: "Confirmado por (todos)" }, { value: "Formulario", label: "📋 Formulario RSVP" }, { value: "Manual", label: "✍️ Manual / otro" }, { value: "SIN", label: "Sin especificar" }]} />
        <Select value={fRegalo} onChange={setFRegalo} options={[{ value: "", label: "Regalo (todos)" }, { value: "CON", label: "🎁 Con regalo" }, { value: "SIN", label: "Sin regalo" }]} />
        <Btn variant="primary" onClick={() => setAdding(!adding)}>{adding ? "Cancelar" : "+ Añadir"}</Btn>
      </div>

      {adding && (
        <Card style={{ marginBottom: 12, background: C.rosePale }}>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
            <Input placeholder="Nombre" value={newG.n} onChange={(v) => setNewG({ ...newG, n: v })} style={{ flex: 1, minWidth: 130 }} />
            <Select value={newG.sex} onChange={(v) => setNewG({ ...newG, sex: v })} options={["Mujer", "Hombre"]} />
            <Select value={newG.comida} onChange={(v) => setNewG({ ...newG, comida: v })} options={MENU_OPTS} />
            <Select value={newG.desp} onChange={(v) => setNewG({ ...newG, desp: v })} options={["Ninguna", "Marga", "Iván"]} />
            <Select value={newG.confirmado} onChange={(v) => setNewG({ ...newG, confirmado: v })} options={CONF_OPTS} />
            <Input placeholder="Mesa" type="number" value={newG.mesa} onChange={(v) => setNewG({ ...newG, mesa: v })} style={{ width: 70 }} />
            <Btn variant="primary" onClick={addGuest}>Guardar</Btn>
          </div>
        </Card>
      )}

      <div style={{ fontSize: 12, color: C.sub, marginBottom: 8 }}>Mostrando {filtered.length} de {guests.length} · 📋 {nViaFormulario} confirmados por el formulario RSVP, {guests.length - nViaFormulario} por otra vía o sin especificar</div>

      <Card style={{ padding: 0, overflow: "hidden" }}>
        <div className="boda-scroll-x" style={{ overflowX: "auto", maxHeight: 560, overflowY: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead>
              <tr>
                {["Nombre", "Sexo", "Mesa", "Familia", "Menú", "Despedida", "Confirma", "Vía", "Regalo", ""].map((h, i) => (
                  <th key={i} style={{ fontSize: 11, fontWeight: 600, textTransform: "uppercase", color: C.sub, textAlign: "left", padding: "9px 12px", borderBottom: `1px solid ${C.grayMid}`, background: C.grayLight, position: "sticky", top: 0, zIndex: 1 }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.map((g) => {
                const isEd = editing === g.id;
                if (isEd) {
                  return (
                    <tr key={g.id} style={{ background: C.rosePale }}>
                      <td style={{ padding: "8px 12px" }}><Input value={draft.n} onChange={(v) => setDraft({ ...draft, n: v })} style={{ width: 130 }} /></td>
                      <td style={{ padding: "8px 12px" }}><Select value={draft.sex} onChange={(v) => setDraft({ ...draft, sex: v })} options={["Mujer", "Hombre"]} /></td>
                      <td style={{ padding: "8px 12px" }}><Input type="number" value={draft.mesa} onChange={(v) => setDraft({ ...draft, mesa: v })} style={{ width: 60 }} /></td>
                      <td style={{ padding: "8px 12px" }}>
                        <SelectBuscable
                          value={draft.familia || ""}
                          onChange={(v) => setDraft({ ...draft, familia: v })}
                          placeholder="Sin familia"
                          options={[{ value: "", label: "Sin familia" }, ...familias.map((f) => ({ value: f.id, label: f.nombre }))]}
                          style={{ maxWidth: 160 }}
                        />
                      </td>
                      <td style={{ padding: "8px 12px" }}><Select value={draft.comida} onChange={(v) => setDraft({ ...draft, comida: v })} options={MENU_OPTS} /></td>
                      <td style={{ padding: "8px 12px" }}><Select value={draft.desp} onChange={(v) => setDraft({ ...draft, desp: v })} options={["Ninguna", "Marga", "Iván"]} /></td>
                      <td style={{ padding: "8px 12px" }}><Select value={draft.confirmado ?? ""} onChange={(v) => setDraft({ ...draft, confirmado: v })} options={CONF_OPTS} /></td>
                      <td style={{ padding: "8px 12px" }}><Select value={draft.origen ?? ""} onChange={(v) => setDraft({ ...draft, origen: v })} options={ORIGEN_OPTS} style={{ maxWidth: 150 }} /></td>
                      <td style={{ padding: "8px 12px", fontSize: 12, color: C.sub }}>{regalos[g.id] > 0 ? fmt(regalos[g.id]) : "—"}</td>
                      <td style={{ padding: "8px 12px", whiteSpace: "nowrap" }}>
                        <Btn small variant="primary" onClick={saveEdit} style={{ marginRight: 4 }}>✓</Btn>
                        <Btn small variant="ghost" onClick={() => setEditing(null)}>✕</Btn>
                      </td>
                    </tr>
                  );
                }
                return (
                  <tr key={g.id}>
                    <td style={{ padding: "9px 12px", borderBottom: `1px solid ${C.grayLight}`, fontWeight: 500, fontSize: 13 }}>{g.n}</td>
                    <td style={{ padding: "9px 12px", borderBottom: `1px solid ${C.grayLight}`, fontSize: 13 }}>{g.sex === "Hombre" ? "👨" : "👩"} {g.sex}</td>
                    <td style={{ padding: "9px 12px", borderBottom: `1px solid ${C.grayLight}` }}>
                      <span style={{ display: "inline-block", width: 26, height: 26, borderRadius: "50%", fontSize: 11, fontWeight: 700, textAlign: "center", lineHeight: "26px", background: mesaColor(g.mesa), color: "#333" }}>
                        {g.mesa ?? "–"}
                      </span>
                    </td>
                    <td style={{ padding: "9px 12px", borderBottom: `1px solid ${C.grayLight}` }}>
                      {g.familia ? (
                        <span style={{ fontSize: 11, fontWeight: 600, background: familiaColor(g.familia), padding: "3px 8px", borderRadius: 20, whiteSpace: "nowrap" }} title={familiaLabel(familias, g.familia)}>
                          👪 {familiaLabel(familias, g.familia)}
                        </span>
                      ) : (
                        <span style={{ fontSize: 11, color: C.sub }}>—</span>
                      )}
                    </td>
                    <td style={{ padding: "9px 12px", borderBottom: `1px solid ${C.grayLight}` }}>
                      <Badge color={menuColor(g.comida)}>{g.comida}</Badge>
                      {g.nota && <div style={{ fontSize: 10, color: C.amber, marginTop: 3 }} title={g.nota}>⚠ {g.nota.length > 40 ? g.nota.slice(0, 40) + "…" : g.nota}</div>}
                    </td>
                    <td style={{ padding: "9px 12px", borderBottom: `1px solid ${C.grayLight}` }}>
                      <Badge color={g.desp === "Marga" ? "rose" : g.desp === "Iván" ? "blue" : "gray"}>{g.desp}</Badge>
                    </td>
                    <td style={{ padding: "9px 12px", borderBottom: `1px solid ${C.grayLight}`, whiteSpace: "nowrap" }}>
                      <span style={{ display: "inline-flex", gap: 3, alignItems: "center" }}>
                        <button onClick={() => setConf(g.id, "Si")} title="Confirmar" style={{ cursor: "pointer", border: "none", borderRadius: 6, width: 24, height: 24, fontSize: 12, background: g.confirmado === "Si" ? C.green : C.grayLight, color: g.confirmado === "Si" ? "#fff" : C.sub }}>✓</button>
                        <button onClick={() => setConf(g.id, "No")} title="No viene" style={{ cursor: "pointer", border: "none", borderRadius: 6, width: 24, height: 24, fontSize: 12, background: g.confirmado === "No" ? C.red : C.grayLight, color: g.confirmado === "No" ? "#fff" : C.sub }}>✕</button>
                        <button onClick={() => setConf(g.id, "")} title="Pendiente" style={{ cursor: "pointer", border: "none", borderRadius: 6, width: 24, height: 24, fontSize: 12, background: !g.confirmado ? C.amber : C.grayLight, color: !g.confirmado ? "#fff" : C.sub }}>?</button>
                      </span>
                    </td>
                    <td style={{ padding: "9px 12px", borderBottom: `1px solid ${C.grayLight}`, whiteSpace: "nowrap" }}>
                      <span style={{ display: "inline-flex", gap: 3, alignItems: "center" }}>
                        <button onClick={() => setOrigen(g.id, "Formulario")} title="Confirmado por el formulario RSVP" style={{ cursor: "pointer", border: "none", borderRadius: 6, width: 24, height: 24, fontSize: 12, background: g.origen === "Formulario" ? C.teal : C.grayLight, color: g.origen === "Formulario" ? "#fff" : C.sub }}>📋</button>
                        <button onClick={() => setOrigen(g.id, "Manual")} title="Confirmado a mano (WhatsApp, llamada...)" style={{ cursor: "pointer", border: "none", borderRadius: 6, width: 24, height: 24, fontSize: 12, background: g.origen === "Manual" ? C.blue : C.grayLight, color: g.origen === "Manual" ? "#fff" : C.sub }}>✍️</button>
                      </span>
                    </td>
                    <td style={{ padding: "9px 12px", borderBottom: `1px solid ${C.grayLight}` }}>
                      {regalos[g.id] > 0 ? <Badge color="rose">🎁 {fmt(regalos[g.id])}</Badge> : <span style={{ fontSize: 11, color: C.sub }}>—</span>}
                    </td>
                    <td style={{ padding: "9px 12px", borderBottom: `1px solid ${C.grayLight}`, whiteSpace: "nowrap" }}>
                      <Btn small variant="ghost" onClick={() => startEdit(g)} style={{ marginRight: 2 }}>✏️</Btn>
                      <Btn small variant="ghost" onClick={() => removeGuest(g.id)}>🗑</Btn>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

// ─────────────────────────────────────────────────────────
// TAB: MESAS (editable — arrastrar y soltar invitados)
// ─────────────────────────────────────────────────────────
function TabMesas({ guests, setGuests, tablesConfig, setTablesConfig, deleteMesa, elementos, setElementos, familias }) {
  const [moving, setMoving] = useState(null); // guest id being movido (fallback sin drag & drop)
  const [q, setQ] = useState("");
  const [dragGuestId, setDragGuestId] = useState(null);
  const [dragOverMesa, setDragOverMesa] = useState(null); // mesa (o "sin" o "mesa-N") sobre la que se arrastra
  const [addingTable, setAddingTable] = useState(false);
  const [newTable, setNewTable] = useState({ nombre: "", capacidad: 10 });
  const [editingTable, setEditingTable] = useState(null); // número de mesa en edición de nombre
  const [draftTable, setDraftTable] = useState({});
  // Orden visual de las tarjetas: por defecto el número de mesa, pero en cuanto arrastras una tarjeta a
  // otro sitio (con el tirador ⠿) se guarda un "orden" explícito por mesa y ese manda a partir de ahí.
  const mesas = useMemo(() => [...tablesConfig].sort((a, b) => (a.orden ?? a.mesa) - (b.orden ?? b.mesa)), [tablesConfig]);
  const byMesa = useMemo(() => {
    const m = {};
    guests.forEach((g) => {
      const k = g.mesa || 0;
      if (!m[k]) m[k] = [];
      m[k].push(g);
    });
    return m;
  }, [guests]);

  const moveTo = (guestId, mesa) => {
    setGuests(guests.map((g) => (g.id === guestId ? { ...g, mesa } : g)));
    setMoving(null);
    setDragGuestId(null);
    setDragOverMesa(null);
  };

  // ── Drag & drop de invitados (a nivel de mesa entera, sin silla concreta) ──
  const onDragStartChip = (e, guestId) => {
    setDragGuestId(guestId);
    e.dataTransfer.setData("text/plain", guestId);
    e.dataTransfer.effectAllowed = "move";
  };
  const onDragEndChip = () => { setDragGuestId(null); setDragOverMesa(null); };
  const onDragOverTarget = (e, key) => {
    e.preventDefault();
    if (dragOverMesa !== key) setDragOverMesa(key);
  };
  const onDropSinMesa = (e) => {
    e.preventDefault();
    const guestId = e.dataTransfer.getData("text/plain") || dragGuestId;
    if (guestId) moveTo(guestId, null);
  };
  const onDropMesa = (e, mesa, confirmada) => {
    e.preventDefault();
    if (confirmada) return;
    const guestId = e.dataTransfer.getData("text/plain") || dragGuestId;
    if (guestId) moveTo(guestId, mesa);
  };

  // ── Gestión de mesas ──
  const nextMesaNum = () => {
    const usados = new Set(tablesConfig.map((t) => t.mesa));
    let n = 1;
    while (usados.has(n)) n++;
    return n;
  };
  const addTable = () => {
    const mesa = nextMesaNum();
    const nombre = newTable.nombre.trim() || `Mesa ${mesa}`;
    setTablesConfig([...tablesConfig, { mesa, nombre, capacidad: +newTable.capacidad || 10, x: 50, y: 50, confirmada: false }]);
    setNewTable({ nombre: "", capacidad: 10 });
    setAddingTable(false);
  };
  const startEditTable = (t) => { if (t.confirmada) return; setEditingTable(t.mesa); setDraftTable({ ...t }); };
  const saveEditTable = () => {
    setTablesConfig(tablesConfig.map((t) => (t.mesa === editingTable ? { ...t, nombre: draftTable.nombre.trim() || t.nombre } : t)));
    setEditingTable(null);
  };
  const removeTable = (mesa) => {
    if ((byMesa[mesa] || []).length > 0) { alert("Esta mesa tiene invitados asignados. Muévelos primero a otra mesa o a «Sin mesa»."); return; }
    if (confirm("¿Eliminar esta mesa?")) deleteMesa(mesa);
  };
  // Cambia el aforo de una mesa.
  const updateCapacidad = (mesa, nuevaCap) => {
    const cap = Math.max(1, Math.round(+nuevaCap) || 1);
    setTablesConfig(tablesConfig.map((t) => (t.mesa === mesa ? { ...t, capacidad: cap } : t)));
  };
  // Confirmar/bloquear una mesa: fija su posición, nombre, aforo y lista de invitados para que no se toquen sin querer.
  const toggleConfirmada = (mesa) => {
    setTablesConfig(tablesConfig.map((t) => (t.mesa === mesa ? { ...t, confirmada: !t.confirmada } : t)));
  };
  // ── Arrastrar tarjetas de mesa para reordenarlas (el tirador ⠿ de cada tarjeta) ──
  const [draggingCardMesa, setDraggingCardMesa] = useState(null);
  const onCardDragStart = (e, mesa) => {
    e.stopPropagation();
    e.dataTransfer.setData("application/x-mesa-card", String(mesa));
    e.dataTransfer.effectAllowed = "move";
    setDraggingCardMesa(mesa);
  };
  const onCardDragEnd = () => { setDraggingCardMesa(null); setDragOverMesa(null); };
  // Mueve la mesa arrastrada justo antes de la mesa destino, y guarda un "orden" secuencial en todas
  // las mesas para que la próxima vez se carguen ya en ese orden (se guarda con el resto de la app).
  const reorderMesas = (mesaArrastrada, mesaDestino) => {
    if (mesaArrastrada === mesaDestino) return;
    const fromIdx = mesas.findIndex((t) => t.mesa === mesaArrastrada);
    const toIdx = mesas.findIndex((t) => t.mesa === mesaDestino);
    if (fromIdx === -1 || toIdx === -1) return;
    const reordenadas = [...mesas];
    const [moved] = reordenadas.splice(fromIdx, 1);
    reordenadas.splice(toIdx, 0, moved);
    const ordenPorMesa = {};
    reordenadas.forEach((t, i) => { ordenPorMesa[t.mesa] = i; });
    setTablesConfig(tablesConfig.map((t) => (ordenPorMesa[t.mesa] !== undefined ? { ...t, orden: ordenPorMesa[t.mesa] } : t)));
  };
  // Une el drop de una chapa de invitado (asignarlo a la mesa) y el drop de una tarjeta arrastrada por
  // su tirador (reordenar) en un único handler, porque ambos caen sobre la misma tarjeta.
  const onCardDragOver = (e, mesa) => {
    e.preventDefault();
    if (e.dataTransfer.types.includes("application/x-mesa-card")) {
      if (dragOverMesa !== `mesa-${mesa}`) setDragOverMesa(`mesa-${mesa}`);
    } else {
      onDragOverTarget(e, `mesa-${mesa}`);
    }
  };
  const onCardDrop = (e, t) => {
    e.preventDefault();
    const mesaArrastrada = e.dataTransfer.getData("application/x-mesa-card");
    if (mesaArrastrada) {
      reorderMesas(+mesaArrastrada, t.mesa);
      setDragOverMesa(null);
    } else {
      onDropMesa(e, t.mesa, t.confirmada);
    }
  };

  const chipStyle = (g, small) => {
    const declined = g.confirmado === "No" || g.comida === "No";
    const matchesQ = !q || g.n.toLowerCase().includes(q.toLowerCase());
    const base = {
      display: "inline-flex", alignItems: "center", gap: 4, padding: small ? "1px 6px" : "3px 9px", margin: small ? 0 : 2, borderRadius: 20,
      fontSize: small ? 9.5 : 11, fontWeight: 500, cursor: "grab",
      border: moving === g.id ? `2px solid ${C.purple}` : g.familia ? `2px solid ${familiaColor(g.familia)}` : "2px solid transparent",
      transition: "all .15s", textDecoration: declined ? "line-through" : "none",
      opacity: dragGuestId === g.id ? 0.3 : declined ? 0.4 : matchesQ ? 1 : 0.25,
      boxShadow: matchesQ && q ? `0 0 0 2px ${C.rose}` : "none", whiteSpace: "nowrap",
    };
    if (g.comida === "Niño") return { ...base, background: C.amberLight, color: C.amber };
    if (!["Adulto", "No"].includes(g.comida)) return { ...base, background: C.redLight, color: C.red }; // restricción
    if (g.sex === "Hombre") return { ...base, background: C.blueLight, color: C.blue };
    return { ...base, background: C.roseLight, color: C.rose };
  };

  const movingGuest = guests.find((g) => g.id === moving);
  const sinMesa = byMesa[0] || [];
  const totalCapacidad = mesas.reduce((s, t) => s + (+t.capacidad || 0), 0);
  const totalAsisten = guests.filter((g) => g.confirmado !== "No" && g.comida !== "No").length;
  const mesasConfirmadas = mesas.filter((t) => t.confirmada).length;

  // Familias repartidas en más de una mesa (o con parte en "Sin mesa") — para sugerir juntarlas
  const familiasRepartidas = useMemo(() => {
    const porFamilia = {};
    guests.forEach((g) => {
      if (!g.familia) return;
      if (!porFamilia[g.familia]) porFamilia[g.familia] = new Set();
      porFamilia[g.familia].add(g.mesa || 0);
    });
    return Object.entries(porFamilia).filter(([, s]) => s.size > 1).map(([fam]) => fam);
  }, [guests]);

  // Tarjeta de una mesa — dónde se ve y edita quién se sienta en ella (arrastra chapas de invitados
  // aquí dentro, o suéltalas para quitarlas). Es una función normal (no un componente aparte) porque
  // usa un montón de estado y handlers ya definidos arriba en TabMesas.
  // Agrupa las tarjetas en filas según su orden (el mismo que controlas arrastrando el tirador ⠿): la
  // primera va sola en su propia fila (pensada para la nupcial, pero es "la que pongas primera"), y el
  // resto se reparte en filas de 4, luego 3, luego 3 — si hay más mesas de las que caben en esas filas,
  // las que sobren se agrupan repitiendo el último tamaño (3). Así consigues el "tablero" 1-4-3-3 que
  // querías, y sigue siendo 100% reordenable: arrastra cualquier tarjeta a otra posición para cambiar
  // en qué fila y en qué sitio cae.
  const TAMANOS_FILAS = [4, 3, 3];
  const filasMesas = useMemo(() => {
    const resto = mesas.slice(1);
    const filas = [];
    let i = 0, fi = 0;
    while (i < resto.length) {
      const tam = TAMANOS_FILAS[Math.min(fi, TAMANOS_FILAS.length - 1)];
      filas.push(resto.slice(i, i + tam));
      i += tam;
      fi++;
    }
    return filas;
  }, [mesas]);

  const renderMesaCard = (t) => {
    const gs = byMesa[t.mesa] || [];
    const cap = Math.max(1, +t.capacidad || 1);
    const asisten = gs.filter((g) => g.confirmado !== "No" && g.comida !== "No");
    const lleno = asisten.length > cap;
    const isEd = editingTable === t.mesa;
    const over = dragOverMesa === `mesa-${t.mesa}`;
    const beingDragged = draggingCardMesa === t.mesa;
    return (
      <Card
        key={t.mesa}
        style={{
          background: t.confirmada ? C.greenLight : C.card,
          border: `1.5px ${over ? "dashed" : "solid"} ${over ? C.rose : t.confirmada ? C.green : lleno ? C.red : C.border}`,
          boxShadow: over ? `0 0 0 3px ${C.roseLight}` : "none",
          opacity: beingDragged ? 0.4 : 1,
        }}
        onDragOver={(e) => onCardDragOver(e, t.mesa)}
        onDrop={(e) => onCardDrop(e, t)}
      >
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6, gap: 6, flexWrap: "wrap" }}>
          {isEd ? (
            <div style={{ display: "flex", gap: 4, alignItems: "center", flex: 1, minWidth: 0 }}>
              <Input value={draftTable.nombre} onChange={(v) => setDraftTable({ ...draftTable, nombre: v })} style={{ flex: 1, minWidth: 0 }} />
              <Btn small variant="primary" onClick={saveEditTable}>✓</Btn>
              <Btn small variant="ghost" onClick={() => setEditingTable(null)}>✕</Btn>
            </div>
          ) : (
            <>
              <span style={{ display: "flex", alignItems: "center", gap: 6, minWidth: 0 }}>
                <span
                  draggable
                  onDragStart={(e) => onCardDragStart(e, t.mesa)}
                  onDragEnd={onCardDragEnd}
                  title="Arrastra para mover esta tarjeta a otro sitio"
                  style={{ cursor: "grab", color: C.sub, fontSize: 14, lineHeight: 1, touchAction: "none" }}
                >
                  ⠿
                </span>
                <span style={{ fontSize: 14, fontWeight: 700, color: t.confirmada ? C.green : C.text }}>{t.nombre}</span>
              </span>
              <Btn small variant="ghost" disabled={t.confirmada} onClick={() => startEditTable(t)}>✎</Btn>
            </>
          )}
        </div>

        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", marginBottom: 8 }}>
          <span style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 12 }}>
            Aforo
            <input
              type="number" min={1} value={t.capacidad} disabled={t.confirmada}
              onChange={(e) => updateCapacidad(t.mesa, e.target.value)}
              style={{ width: 46, fontSize: 12, padding: "3px 5px", border: `1px solid ${C.border}`, borderRadius: 6, background: t.confirmada ? C.grayLight : "#fff" }}
            />
          </span>
          <Badge color={lleno ? "red" : "teal"}>{asisten.length}/{t.capacidad}</Badge>
          {lleno && <Badge color="red">⚠</Badge>}
        </div>

        <div style={{ lineHeight: 1.9, minHeight: 34, marginBottom: 8 }}>
          {gs.length === 0 ? (
            <span style={{ fontSize: 11, color: C.sub, fontStyle: "italic" }}>Arrastra invitados aquí</span>
          ) : gs.map((g) => (
            <span
              key={g.id}
              draggable
              onDragStart={(e) => onDragStartChip(e, g.id)}
              onDragEnd={onDragEndChip}
              style={chipStyle(g)}
              onClick={() => setMoving(moving === g.id ? null : g.id)}
              title={g.familia ? `Familia: ${familiaLabel(familias, g.familia)}` : undefined}
            >
              {g.n}
            </span>
          ))}
        </div>

        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          <Btn
            small
            variant={t.confirmada ? "teal" : "primary"}
            onClick={() => toggleConfirmada(t.mesa)}
            style={t.confirmada ? { background: C.greenLight, color: C.green } : {}}
          >
            {t.confirmada ? "✓ Confirmada" : "Confirmar"}
          </Btn>
          {gs.length === 0 && !t.confirmada && (
            <Btn small variant="ghost" onClick={() => removeTable(t.mesa)}>🗑</Btn>
          )}
        </div>
      </Card>
    );
  };

  return (
    <div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12, alignItems: "center" }}>
        <Badge color="gray">{mesas.length} mesas</Badge>
        <Badge color="gray">{guests.length} invitados</Badge>
        <Badge color={totalAsisten > totalCapacidad ? "red" : "teal"}>{totalAsisten} asisten / {totalCapacidad} sillas</Badge>
        {sinMesa.length > 0 && <Badge color="purple">{sinMesa.length} sin asignar</Badge>}
        {mesasConfirmadas > 0 && <Badge color="green">{mesasConfirmadas}/{mesas.length} mesas confirmadas</Badge>}
        <div style={{ flex: 1 }} />
        <Btn small variant="primary" onClick={() => setAddingTable(!addingTable)}>{addingTable ? "Cancelar" : "+ Nueva mesa"}</Btn>
      </div>

      {familiasRepartidas.length > 0 && (
        <Card style={{ marginBottom: 12, background: C.amberLight, border: `1px solid ${C.amber}33` }}>
          <div style={{ fontSize: 13, color: C.amber }}>
            <strong>💡 Sugerencia:</strong> {familiasRepartidas.map((f) => familiaLabel(familias, f)).join(" · ")} {familiasRepartidas.length > 1 ? "están repartidas en varias mesas" : "está repartida en varias mesas"}. El borde de color en cada chapa indica su familia — arrástralas a la misma mesa si quieres sentarlas juntas.
          </div>
        </Card>
      )}

      {addingTable && (
        <Card style={{ marginBottom: 12, background: C.rosePale }}>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
            <Input placeholder={`Nombre (ej. Mesa ${nextMesaNum()})`} value={newTable.nombre} onChange={(v) => setNewTable({ ...newTable, nombre: v })} style={{ flex: 1, minWidth: 160 }} />
            <Input placeholder="Aforo" type="number" value={newTable.capacidad} onChange={(v) => setNewTable({ ...newTable, capacidad: v })} style={{ width: 90 }} />
            <Btn variant="primary" onClick={addTable}>Crear mesa</Btn>
          </div>
        </Card>
      )}

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
        <Input placeholder="🔍 Buscar invitado para localizarlo…" value={q} onChange={setQ} style={{ flex: 1, minWidth: 200 }} />
      </div>

      {moving ? (
        <div style={{ position: "sticky", top: 60, zIndex: 50, background: C.purpleLight, border: `1px solid ${C.purple}`, borderRadius: 10, padding: "10px 14px", marginBottom: 12, display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
          <span style={{ fontSize: 13 }}>Moviendo a <strong>{movingGuest?.n}</strong> — elige mesa:</span>
          {mesas.map((t) => (
            <Btn key={t.mesa} small onClick={() => moveTo(moving, t.mesa)} style={{ background: `hsl(${t.mesa * 27},60%,88%)`, color: "#333" }}>{t.nombre}</Btn>
          ))}
          <Btn small onClick={() => moveTo(moving, null)}>Sin mesa</Btn>
          <Btn small variant="ghost" onClick={() => setMoving(null)}>Cancelar</Btn>
        </div>
      ) : (
        <div style={{ fontSize: 12, color: C.sub, marginBottom: 12 }}>
          💡 Arrastra un invitado hasta la tarjeta de la mesa donde quieras sentarlo (o haz clic en su chapa y elige la mesa desde el menú, útil en móvil). Más abajo tienes el plano de la finca por si quieres ajustar la posición de las mesas, el portón, los árboles…
        </div>
      )}

      <div
        style={{
          background: C.card, border: `2px dashed ${dragOverMesa === "sin" ? C.rose : C.grayMid}`,
          borderRadius: 12, padding: "14px 16px", marginBottom: 16, boxShadow: dragOverMesa === "sin" ? `0 0 0 3px ${C.roseLight}` : "none",
        }}
        onDragOver={(e) => onDragOverTarget(e, "sin")}
        onDragLeave={() => setDragOverMesa((cur) => (cur === "sin" ? null : cur))}
        onDrop={onDropSinMesa}
      >
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
          <span style={{ fontSize: 13, fontWeight: 700, color: C.gray }}>Sin mesa</span>
          <span style={{ fontSize: 11, color: C.sub }}>{sinMesa.length}</span>
        </div>
        <div style={{ fontSize: 11, color: C.sub, marginBottom: 8 }}>Pendientes de asignar — arrastra aquí para quitar de una mesa</div>
        <div style={{ lineHeight: 1.9, minHeight: 30 }}>
          {sinMesa.map((g) => (
            <span
              key={g.id}
              draggable
              onDragStart={(e) => onDragStartChip(e, g.id)}
              onDragEnd={onDragEndChip}
              style={chipStyle(g)}
              onClick={() => setMoving(moving === g.id ? null : g.id)}
              title={g.familia ? `Familia: ${familiaLabel(familias, g.familia)}` : undefined}
            >
              {g.n}
            </span>
          ))}
        </div>
      </div>

      {/* ── Mesas: de un vistazo, quién hay en cada una — arrastra las chapas entre tarjetas para
          moverlos de mesa. Arrastra el tirador ⠿ de una tarjeta para colocarla donde quieras: el orden
          se guarda y se respeta en la próxima visita. La primera queda sola y centrada en su propia
          fila (por defecto la nupcial, pero puede ser la que arrastres a esa posición), y el resto se
          reparte debajo en filas de 4-3-3 ── */}
      <div style={{ display: "flex", flexDirection: "column", gap: 12, marginBottom: 16 }}>
        {mesas[0] && (
          <div style={{ display: "flex", justifyContent: "center" }}>
            <div style={{ width: "100%", maxWidth: 260 }}>{renderMesaCard(mesas[0])}</div>
          </div>
        )}
        {filasMesas.map((fila, i) => (
          <div key={i} style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(190px, 1fr))", gap: 12 }}>
            {fila.map(renderMesaCard)}
          </div>
        ))}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────
// Utilidad de fecha usada por PagosDePartida y por la exportación a Excel
// ─────────────────────────────────────────────────────────
function fmtFecha(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  if (!d) return iso;
  return `${d}/${m}/${y}`;
}

// ─────────────────────────────────────────────────────────
// TAB: CUESTIONARIO (Bebidas, Canciones, Revisar — del RSVP)
// ─────────────────────────────────────────────────────────
function TabCuestionario({ bebidas, setBebidas, canciones, setCanciones, revisar, setRevisar }) {
  const [sub, setSub] = useState("bebidas");

  // ── BEBIDAS ──
  const [addingB, setAddingB] = useState(false);
  const [newB, setNewB] = useState({ bebida: "", menciones: "", quien: "" });
  const [editB, setEditB] = useState(null);
  const [draftB, setDraftB] = useState({});
  const bebidasOrdenadas = [...bebidas].sort((a, b) => (b.menciones || 0) - (a.menciones || 0));
  const totalMenciones = bebidas.reduce((s, b) => s + (+b.menciones || 0), 0);
  const addBebida = () => {
    if (!newB.bebida.trim()) return;
    setBebidas([...bebidas, { ...newB, menciones: +newB.menciones || 0, id: "beb_" + Date.now() }]);
    setNewB({ bebida: "", menciones: "", quien: "" });
    setAddingB(false);
  };
  const saveBebida = () => {
    setBebidas(bebidas.map((b) => (b.id === editB ? { ...draftB, menciones: +draftB.menciones || 0 } : b)));
    setEditB(null);
  };
  const delBebida = (id) => { if (confirm("¿Eliminar esta bebida?")) setBebidas(bebidas.filter((b) => b.id !== id)); };

  // ── CANCIONES ──
  const [addingC, setAddingC] = useState(false);
  const [newC, setNewC] = useState({ cancion: "", artista: "", quien: "" });
  const [editC, setEditC] = useState(null);
  const [draftC, setDraftC] = useState({});
  const [qC, setQC] = useState("");
  const cancionesFiltradas = canciones.filter((c) => !qC || c.cancion.toLowerCase().includes(qC.toLowerCase()) || (c.artista || "").toLowerCase().includes(qC.toLowerCase()));
  const addCancion = () => {
    if (!newC.cancion.trim()) return;
    setCanciones([...canciones, { ...newC, id: "can_" + Date.now() }]);
    setNewC({ cancion: "", artista: "", quien: "" });
    setAddingC(false);
  };
  const saveCancion = () => {
    setCanciones(canciones.map((c) => (c.id === editC ? draftC : c)));
    setEditC(null);
  };
  const delCancion = (id) => { if (confirm("¿Eliminar esta canción?")) setCanciones(canciones.filter((c) => c.id !== id)); };

  // ── REVISAR ──
  const [verResueltos, setVerResueltos] = useState(false);
  const [addingR, setAddingR] = useState(false);
  const [newR, setNewR] = useState({ caso: "", original: "", interpretacion: "", accion: "" });
  const pendientes = revisar.filter((r) => !r.resuelto);
  const resueltos = revisar.filter((r) => r.resuelto);
  const marcarResuelto = (id, val) => setRevisar(revisar.map((r) => (r.id === id ? { ...r, resuelto: val } : r)));
  const delRevisar = (id) => { if (confirm("¿Eliminar esta nota?")) setRevisar(revisar.filter((r) => r.id !== id)); };
  const addRevisar = () => {
    if (!newR.caso.trim()) return;
    setRevisar([...revisar, { ...newR, id: "rev_" + Date.now(), resuelto: false }]);
    setNewR({ caso: "", original: "", interpretacion: "", accion: "" });
    setAddingR(false);
  };

  return (
    <div>
      <div style={{ display: "flex", gap: 4, marginBottom: 16, background: C.grayLight, padding: 4, borderRadius: 10, width: "fit-content" }}>
        {[["bebidas", "🍹 Bebidas"], ["canciones", "🎵 Canciones"], ["revisar", `🔎 Revisar${pendientes.length ? ` (${pendientes.length})` : ""}`]].map(([id, lbl]) => (
          <button key={id} onClick={() => setSub(id)} style={{ padding: "6px 14px", border: "none", borderRadius: 7, fontSize: 12, fontWeight: 500, cursor: "pointer", background: sub === id ? C.card : "transparent", color: sub === id ? C.text : C.sub, boxShadow: sub === id ? "0 1px 4px rgba(0,0,0,.08)" : "none" }}>{lbl}</button>
        ))}
      </div>

      {sub === "bebidas" && (

          </div>
          <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 10 }}>
            <Btn variant="primary" onClick={() => setAddingB(!addingB)}>{addingB ? "Cancelar" : "+ Añadir bebida"}</Btn>
          </div>
          {addingB && (
            <Card style={{ marginBottom: 12, background: C.rosePale }}>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>

                <Input placeholder="Menciones" type="number" value={newB.menciones} onChange={(v) => setNewB({ ...newB, menciones: v })} style={{ width: 100 }} />

            </Card>

          <Card style={{ padding: 0, overflow: "hidden" }}>
            <div className="boda-scroll-x" style={{ overflowX: "auto" }}>
              <table style={{ width: "100%", borderCollapse: "collapse" }}>
                <thead>
                  <tr>
                    {["Bebida", "Menciones", "Quién la pidió", ""].map((h) => (
                      <th key={h} style={{ fontSize: 11, fontWeight: 600, textTransform: "uppercase", letterSpacing: ".5px", color: C.sub, textAlign: "left", padding: "10px 12px", borderBottom: `1px solid ${C.grayMid}`, background: C.grayLight }}>{h}</th>

                <tbody>
                  {bebidasOrdenadas.map((b) => {
                    const isEd = editB === b.id;
                    if (isEd) {
                      return (
                        <tr key={b.id} style={{ background: C.rosePale }}>
                          <td style={{ padding: "8px 12px" }}><Input value={draftB.bebida} onChange={(v) => setDraftB({ ...draftB, bebida: v })} style={{ width: 160 }} /></td>
                          <td style={{ padding: "8px 12px" }}><Input type="number" value={draftB.menciones} onChange={(v) => setDraftB({ ...draftB, menciones: v })} style={{ width: 80 }} /></td>
                          <td style={{ padding: "8px 12px" }}><Input value={draftB.quien} onChange={(v) => setDraftB({ ...draftB, quien: v })} style={{ width: "100%" }} /></td>
                          <td style={{ padding: "8px 12px", whiteSpace: "nowrap" }}>
                            <Btn small variant="primary" onClick={saveBebida} style={{ marginRight: 4 }}>✓</Btn>
                            <Btn small variant="ghost" onClick={() => setEditB(null)}>✕</Btn>

                      );

                    return (
                      <tr key={b.id}>

                        <td style={{ padding: "10px 12px", borderBottom: `1px solid ${C.grayLight}`, whiteSpace: "nowrap" }}>
                          <Btn small variant="ghost" onClick={() => { setEditB(b.id); setDraftB({ ...b }); }} style={{ marginRight: 2 }}>✏️</Btn>
                          <Btn small variant="ghost" onClick={() => delBebida(b.id)}>🗑</Btn>
                        </td>

                    );
                  })}
                </tbody>
              </table>
            </div>
          </Card>
        </>
      )}

      {sub === "canciones" && (
        <>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14, alignItems: "center" }}>
            <Badge color="gray">{canciones.length} canciones</Badge>

          </div>
          {addingC && (
            <Card style={{ marginBottom: 12, background: C.rosePale }}>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                <Input placeholder="Canción" value={newC.cancion} onChange={(v) => setNewC({ ...newC, cancion: v })} style={{ flex: 2, minWidth: 160 }} />
                <Input placeholder="Artista" value={newC.artista} onChange={(v) => setNewC({ ...newC, artista: v })} style={{ flex: 1, minWidth: 140 }} />
                <Input placeholder="Pedida por" value={newC.quien} onChange={(v) => setNewC({ ...newC, quien: v })} style={{ flex: 1, minWidth: 140 }} />

          <Card style={{ padding: 0, overflow: "hidden" }}>
            <div className="boda-scroll-x" style={{ overflowX: "auto", maxHeight: 560, overflowY: "auto" }}>
              <table style={{ width: "100%", borderCollapse: "collapse" }}>

                  <tr>
                    {["Canción", "Artista", "Pedida por", ""].map((h) => (
                      <th key={h} style={{ fontSize: 11, fontWeight: 600, textTransform: "uppercase", letterSpacing: ".5px", color: C.sub, textAlign: "left", padding: "10px 12px", borderBottom: `1px solid ${C.grayMid}`, background: C.grayLight, position: "sticky", top: 0 }}>{h}</th>
                    ))}

                <tbody>
                  {cancionesFiltradas.map((c) => {
                    const isEd = editC === c.id;
                    if (isEd) {
                      return (
                        <tr key={c.id} style={{ background: C.rosePale }}>
                          <td style={{ padding: "8px 12px" }}><Input value={draftC.cancion} onChange={(v) => setDraftC({ ...draftC, cancion: v })} style={{ width: 180 }} /></td>
                          <td style={{ padding: "8px 12px" }}><Input value={draftC.artista} onChange={(v) => setDraftC({ ...draftC, artista: v })} style={{ width: 140 }} /></td>
                          <td style={{ padding: "8px 12px" }}><Input value={draftC.quien} onChange={(v) => setDraftC({ ...draftC, quien: v })} style={{ width: 140 }} /></td>
                          <td style={{ padding: "8px 12px", whiteSpace: "nowrap" }}>
                            <Btn small variant="primary" onClick={saveCancion} style={{ marginRight: 4 }}>✓</Btn>
                            <Btn small variant="ghost" onClick={() => setEditC(null)}>✕</Btn>
                          </td>
                        </tr>
                      );
                    }
                    return (
                      <tr key={c.id}>
                        <td style={{ padding: "9px 12px", borderBottom: `1px solid ${C.grayLight}`, fontWeight: 500, fontSize: 13 }}>{c.cancion}</td>
                        <td style={{ padding: "9px 12px", borderBottom: `1px solid ${C.grayLight}`, fontSize: 12, color: c.artista?.toLowerCase().includes("sin confirmar") || c.artista?.toLowerCase().includes("no identificado") ? C.amber : C.sub }}>{c.artista || "—"}</td>
                        <td style={{ padding: "9px 12px", borderBottom: `1px solid ${C.grayLight}`, fontSize: 12, color: C.sub }}>{c.quien}</td>
                        <td style={{ padding: "9px 12px", borderBottom: `1px solid ${C.grayLight}`, whiteSpace: "nowrap" }}>
                          <Btn small variant="ghost" onClick={() => { setEditC(c.id); setDraftC({ ...c }); }} style={{ marginRight: 2 }}>✏️</Btn>
                          <Btn small variant="ghost" onClick={() => delCancion(c.id)}>🗑</Btn>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </Card>
        </>
      )}

      {sub === "revisar" && (
        <>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14, alignItems: "center" }}>
            <Badge color={pendientes.length ? "amber" : "green"}>{pendientes.length} pendientes</Badge>
            <Badge color="gray">{resueltos.length} resueltos</Badge>
            <div style={{ flex: 1 }} />
            <Btn small variant={verResueltos ? "primary" : "default"} onClick={() => setVerResueltos(!verResueltos)}>{verResueltos ? "Ver solo pendientes" : "Ver también resueltos"}</Btn>
            <Btn variant="primary" onClick={() => setAddingR(!addingR)}>{addingR ? "Cancelar" : "+ Añadir nota"}</Btn>
          </div>

          {addingR && (
            <Card style={{ marginBottom: 12, background: C.rosePale }}>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                <Input placeholder="Caso (título breve)" value={newR.caso} onChange={(v) => setNewR({ ...newR, caso: v })} />
                <Input placeholder="Respuesta original / contexto" value={newR.original} onChange={(v) => setNewR({ ...newR, original: v })} />
                <Input placeholder="Tu interpretación" value={newR.interpretacion} onChange={(v) => setNewR({ ...newR, interpretacion: v })} />
                <Input placeholder="Qué hay que decidir/revisar" value={newR.accion} onChange={(v) => setNewR({ ...newR, accion: v })} />
                <div style={{ textAlign: "right" }}><Btn variant="primary" onClick={addRevisar}>Guardar</Btn></div>
              </div>
            </Card>
          )}

          {pendientes.length === 0 && !verResueltos && (
            <div style={{ fontSize: 13, color: C.sub, textAlign: "center", padding: 30 }}>🎉 No quedan casos pendientes de revisar.</div>
          )}

          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {(verResueltos ? revisar : pendientes).map((r) => (
              <Card key={r.id} style={{ background: r.resuelto ? C.grayLight : C.amberLight, border: `1px solid ${r.resuelto ? C.grayMid : C.amber}33`, opacity: r.resuelto ? 0.7 : 1 }}>
                <div style={{ display: "flex", justifyContent: "space-between", gap: 10, alignItems: "flex-start" }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: r.resuelto ? C.sub : C.amber, textDecoration: r.resuelto ? "line-through" : "none" }}>{r.caso}</div>
                  <div style={{ display: "flex", gap: 4, flexShrink: 0 }}>
                    {r.resuelto ? (
                      <Btn small variant="ghost" onClick={() => marcarResuelto(r.id, false)}>↺ Reabrir</Btn>
                    ) : (
                      <Btn small variant="teal" onClick={() => marcarResuelto(r.id, true)}>✓ Resuelto</Btn>
                    )}
                    <Btn small variant="ghost" onClick={() => delRevisar(r.id)}>🗑</Btn>
                  </div>
                </div>
                {r.original && <div style={{ fontSize: 12, color: C.sub, marginTop: 6 }}><strong>Respuesta original:</strong> {r.original}</div>}
                {r.interpretacion && <div style={{ fontSize: 12, color: C.sub, marginTop: 4 }}><strong>Interpretación:</strong> {r.interpretacion}</div>}
                {r.accion && <div style={{ fontSize: 12, color: C.red, marginTop: 4 }}><strong>Qué revisar:</strong> {r.accion}</div>}
              </Card>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────
// APP PRINCIPAL
// ─────────────────────────────────────────────────────────
function BodaApp() {
  const [tab, setTab] = useState("finanzas");
  const [gastos, setGastosRaw] = useState(GASTOS_INIT);
  const [guests, setGuestsRaw] = useState(GUESTS_INIT);
  const [pagos, setPagosRaw] = useState(PAGOS_INIT);
  const [devoluciones, setDevolucionesRaw] = useState(DEVOLUCIONES_INIT);
  const [tablesConfig, setTablesConfigRaw] = useState(MESAS_CONFIG_INIT);
  const [mesasEliminadas, setMesasEliminadasRaw] = useState([]); // nº de mesas que borraste tú a mano, para no revivirlas
  const [elementos, setElementosRaw] = useState(ELEMENTOS_INIT);
  const [familias, setFamiliasRaw] = useState(FAMILIAS_INIT);
  const [bebidas, setBebidasRaw] = useState(BEBIDAS_INIT);
  const [canciones, setCancionesRaw] = useState(CANCIONES_INIT);
  const [revisar, setRevisarRaw] = useState(REVISAR_INIT);
  const [loaded, setLoaded] = useState(false);
  const [saveStatus, setSaveStatus] = useState("idle"); // idle | saving | saved | error
  // Preferencia puramente visual de este dispositivo/navegador: no viaja a Google Sheets ni a otros
  // dispositivos, cada uno la recuerda por su cuenta (útil para enseñar la pantalla sin que se vean
  // las cantidades, sin afectar a lo que ve el resto).
  const [ocultarCantidades, setOcultarCantidades] = useState(() => {
    try {
      return localStorage.getItem("boda-ocultar-cantidades") === "1";
    } catch (e) {
      return false;
    }
  });
  // Se actualiza de forma síncrona (no en un useEffect) para que fmt/fmt2 ya reflejen el nuevo valor
  // en este mismo render, sin esperar a un segundo repintado.
  OCULTAR_CANTIDADES = ocultarCantidades;
  useEffect(() => {
    try {
      localStorage.setItem("boda-ocultar-cantidades", ocultarCantidades ? "1" : "0");
    } catch (e) {}
  }, [ocultarCantidades]);

  // Load persisted state on mount
  useEffect(() => {
    (async () => {
      const st = await loadState();
      if (st) {
        let mergedGastos = st.gastos;
        if (st.gastos) {
          mergedGastos = mergeGastosWithLatest(st.gastos);
          setGastosRaw(mergedGastos);
        }
        let mergedGuests = st.guests;
        if (st.guests) {
          // Rellena con lo nuevo del cuestionario RSVP (familia, confirmaciones, la corrección de Mar Ander)
          // sin pisar mesas ni ediciones manuales ya guardadas en este navegador.
          mergedGuests = mergeGuestsWithLatest(st.guests);
          setGuestsRaw(mergedGuests);
        }
        let mergedPagos = st.pagos || [];
        if (st.pagos) {
          // Añade pagos nuevos de PAGOS_INIT (p.ej. el 50% del catering pagado el 11/08/2026) que no
          // tuvieras guardados todavía, sin duplicar ni tocar los que ya tenías.
          mergedPagos = mergePagosWithLatest(st.pagos);
        }
        // Por si tu navegador llegó a migrar (con una versión anterior de esta migración, con un bug) el
        // antiguo "Ajuste de conciliación" como si fuera un ingreso real de 895€: se quita, ya no hace
        // falta ningún ajuste a mano.
        mergedPagos = limpiarAjusteFantasma(mergedPagos);
        // Migración única: si tu navegador guardó una sesión de antes de fusionar "Pagos" y
        // "Movimientos de huchas" en un solo registro, convierte lo que quedaba en movimientos (dinero
        // de la hucha Boda que no fuera ya un duplicado) en pagos enlazados a una partida, y descarta
        // del todo lo de la hucha Viajes/Casa, que ya no se sigue.
        if (st.movimientos && st.movimientos.length) {
          const migrados = migrarMovimientosAPagos(st.movimientos, mergedGastos || GASTOS_INIT);
          if (migrados.length) {
            const clave = (p) => `${p.concepto}|${p.cantidad}|${p.partida}`;
            const yaHay = new Set(mergedPagos.map(clave));
            const nuevosMigrados = migrados.filter((p) => !yaHay.has(clave(p)));
            if (nuevosMigrados.length) mergedPagos = [...mergedPagos, ...nuevosMigrados];
          }
        }
        // Si añadiste a mano una partida "Mago" antes de que la app trajera la suya (g16), fusiona las
        // dos en una sola de 300€ y repunta a ella cualquier pago que estuviera enlazado a la duplicada.
        // (Si por lo que sea no llegaron gastos guardados, no hay nada que fusionar todavía.)
        const fusionMago = mergedGastos ? fusionarPartidasDuplicadas(mergedGastos, mergedPagos, "Mago") : { cambiado: false };
        if (fusionMago.cambiado) {
          mergedGastos = fusionMago.gastos;
          mergedPagos = fusionMago.pagos;
          setGastosRaw(mergedGastos);
        }
        if (mergedPagos !== st.pagos) setPagosRaw(mergedPagos);
        if (st.devoluciones) setDevolucionesRaw(st.devoluciones);
        const mesasEliminadasGuardadas = st.mesasEliminadas || [];
        setMesasEliminadasRaw(mesasEliminadasGuardadas);
        let mergedTablesConfig = st.tablesConfig;
        if (st.tablesConfig) {
          // Añade posición en el plano y estado "confirmada" a mesas guardadas de antes de tener el
          // plano de la finca, sin pisar el aforo/nombre/posición que ya hubieras ajustado a mano —
          // y sin revivir ninguna mesa que hayas borrado tú mismo.
          mergedTablesConfig = mergeTablesConfigWithLatest(st.tablesConfig, mesasEliminadasGuardadas);
          setTablesConfigRaw(mergedTablesConfig);
        }
        let mergedElementos = st.elementos;
        if (st.elementos) {
          // Igual que con las mesas: rellena posición si faltara, sin pisar lo que ya hubieras movido.
          mergedElementos = mergeElementosWithLatest(st.elementos);
          setElementosRaw(mergedElementos);
        } else {
          // Sesión de antes de poder mover portón/árboles/etc.: arranca con las posiciones por defecto.
          mergedElementos = ELEMENTOS_INIT;
          setElementosRaw(mergedElementos);
        }
        let mergedFamilias = st.familias;
        if (st.familias) {
          mergedFamilias = mergeFamiliasWithLatest(st.familias);
          setFamiliasRaw(mergedFamilias);
        }
        if (st.bebidas) setBebidasRaw(st.bebidas);
        if (st.canciones) setCancionesRaw(st.canciones);
        let mergedRevisar = st.revisar;
        if (st.revisar) {
          mergedRevisar = mergeRevisarWithLatest(st.revisar);
          setRevisarRaw(mergedRevisar);
        }
        // Guarda de una sola vez cualquier migración aditiva (familia nueva, caso resuelto, movimientos
        // convertidos a pagos, etc.) sin pisar entre sí los distintos merges. `movimientos` se quita del
        // guardado: ya no existe ese registro, todo vive en `pagos`.
        if ((mergedGastos && JSON.stringify(mergedGastos) !== JSON.stringify(st.gastos)) ||
            (mergedGuests && JSON.stringify(mergedGuests) !== JSON.stringify(st.guests)) ||
            JSON.stringify(mergedPagos) !== JSON.stringify(st.pagos || []) ||
            (mergedFamilias && JSON.stringify(mergedFamilias) !== JSON.stringify(st.familias)) ||
            (mergedRevisar && JSON.stringify(mergedRevisar) !== JSON.stringify(st.revisar)) ||
            (mergedTablesConfig && JSON.stringify(mergedTablesConfig) !== JSON.stringify(st.tablesConfig)) ||
            (mergedElementos && JSON.stringify(mergedElementos) !== JSON.stringify(st.elementos || null)) ||
            st.movimientos) {
          persist({
            ...st,
            gastos: mergedGastos || st.gastos || gastos,
            guests: mergedGuests || st.guests || guests,
            pagos: mergedPagos,
            devoluciones: st.devoluciones || devoluciones,
            movimientos: undefined,
            elementos: mergedElementos || st.elementos || elementos,
            familias: mergedFamilias || st.familias || familias,
            revisar: mergedRevisar || st.revisar || revisar,
            tablesConfig: mergedTablesConfig || st.tablesConfig || tablesConfig,
            mesasEliminadas: mesasEliminadasGuardadas,
            bebidas: st.bebidas || bebidas,
            canciones: st.canciones || canciones,
          });
        }
      }
      setLoaded(true);
    })();
  }, []);

  // Auto-save whenever data changes (after initial load)
  const persist = useCallback(async (next) => {
    setSaveStatus("saving");
    const ok = await saveState(next);
    setSaveStatus(ok ? "saved" : "error");
    if (ok) setTimeout(() => setSaveStatus("idle"), 1800);
  }, []);

  const snapshot = (over = {}) => ({ gastos, guests, pagos, devoluciones, tablesConfig, mesasEliminadas, elementos, familias, bebidas, canciones, revisar, ...over });

  const setGastos = (g) => { setGastosRaw(g); persist(snapshot({ gastos: g })); };
  const setGuests = (gu) => { setGuestsRaw(gu); persist(snapshot({ guests: gu })); };
  const setPagos = (p) => { setPagosRaw(p); persist(snapshot({ pagos: p })); };
  const setDevoluciones = (d) => { setDevolucionesRaw(d); persist(snapshot({ devoluciones: d })); };
  const setTablesConfig = (tc) => { setTablesConfigRaw(tc); persist(snapshot({ tablesConfig: tc })); };
  // Borra una mesa Y recuerda para siempre que la borraste (en el mismo guardado, para no perder el
  // dato si el navegador recarga justo entre medias). Así no vuelve a aparecer en el próximo reload.
  const deleteMesa = (mesa) => {
    const tc = tablesConfig.filter((t) => t.mesa !== mesa);
    const me = mesasEliminadas.includes(mesa) ? mesasEliminadas : [...mesasEliminadas, mesa];
    setTablesConfigRaw(tc);
    setMesasEliminadasRaw(me);
    persist(snapshot({ tablesConfig: tc, mesasEliminadas: me }));
  };
  const setElementos = (el) => { setElementosRaw(el); persist(snapshot({ elementos: el })); };
  const setFamilias = (f) => { setFamiliasRaw(f); persist(snapshot({ familias: f })); };
  const setBebidas = (b) => { setBebidasRaw(b); persist(snapshot({ bebidas: b })); };
  const setCanciones = (c) => { setCancionesRaw(c); persist(snapshot({ canciones: c })); };
  const setRevisar = (r) => { setRevisarRaw(r); persist(snapshot({ revisar: r })); };

  const resetAll = async () => {
    if (!confirm("¿Restaurar todos los datos originales del Excel? Se perderán los cambios de ambos.")) return;
    setGastosRaw(GASTOS_INIT);
    setGuestsRaw(GUESTS_INIT);
    setPagosRaw(PAGOS_INIT);
    setDevolucionesRaw(DEVOLUCIONES_INIT);
    setTablesConfigRaw(MESAS_CONFIG_INIT);
    setMesasEliminadasRaw([]);
    setElementosRaw(ELEMENTOS_INIT);
    setFamiliasRaw(FAMILIAS_INIT);
    setBebidasRaw(BEBIDAS_INIT);
    setCancionesRaw(CANCIONES_INIT);
    setRevisarRaw(REVISAR_INIT);
    persist({ gastos: GASTOS_INIT, guests: GUESTS_INIT, pagos: PAGOS_INIT, devoluciones: DEVOLUCIONES_INIT, tablesConfig: MESAS_CONFIG_INIT, mesasEliminadas: [], elementos: ELEMENTOS_INIT, familias: FAMILIAS_INIT, bebidas: BEBIDAS_INIT, canciones: CANCIONES_INIT, revisar: REVISAR_INIT });
  };

  // Recarga los datos guardados (útil si tu pareja ha hecho cambios desde su móvil)
  const refreshData = async () => {
    const st = await loadState();
    if (st) {
      let nuevosGastos = st.gastos ? mergeGastosWithLatest(st.gastos) : gastos;
      let nuevosPagos = limpiarAjusteFantasma(st.pagos ? mergePagosWithLatest(st.pagos) : pagos);
      if (st.movimientos && st.movimientos.length) {
        const migrados = migrarMovimientosAPagos(st.movimientos, nuevosGastos);
        if (migrados.length) {
          const clave = (p) => `${p.concepto}|${p.cantidad}|${p.partida}`;
          const yaHay = new Set(nuevosPagos.map(clave));
          const nuevosMigrados = migrados.filter((p) => !yaHay.has(clave(p)));
          if (nuevosMigrados.length) nuevosPagos = [...nuevosPagos, ...nuevosMigrados];
        }
      }
      const fusionMago = fusionarPartidasDuplicadas(nuevosGastos, nuevosPagos, "Mago");
      if (fusionMago.cambiado) {
        nuevosGastos = fusionMago.gastos;
        nuevosPagos = fusionMago.pagos;
      }
      if (st.gastos || fusionMago.cambiado) setGastosRaw(nuevosGastos);
      if (st.guests) setGuestsRaw(mergeGuestsWithLatest(st.guests));
      if (st.pagos || st.movimientos || fusionMago.cambiado) setPagosRaw(nuevosPagos);
      if (st.devoluciones) setDevolucionesRaw(st.devoluciones);
      const mesasEliminadasActuales = st.mesasEliminadas || mesasEliminadas;
      if (st.mesasEliminadas) setMesasEliminadasRaw(st.mesasEliminadas);
      if (st.tablesConfig) setTablesConfigRaw(mergeTablesConfigWithLatest(st.tablesConfig, mesasEliminadasActuales));
      if (st.elementos) setElementosRaw(mergeElementosWithLatest(st.elementos));
      if (st.familias) setFamiliasRaw(mergeFamiliasWithLatest(st.familias));
      if (st.bebidas) setBebidasRaw(st.bebidas);
      if (st.canciones) setCancionesRaw(st.canciones);
      if (st.revisar) setRevisarRaw(mergeRevisarWithLatest(st.revisar));
      setSaveStatus("saved");
      setTimeout(() => setSaveStatus("idle"), 1500);
    }
  };

  // #3 — Exportar todo a Excel (varias hojas)
  const exportExcel = () => {
    const paidMap = pagadoPorPartida(pagos);
    const wb = XLSX.utils.book_new();

    const wsGastos = XLSX.utils.json_to_sheet(gastos.map((g) => ({
      Partida: g.c, Tipo: g.tipo === "ingreso" ? "Ingreso" : "Gasto", Total: g.total, Pagado: paidMap[g.id] || 0, Pendiente: g.total - (paidMap[g.id] || 0), Estado: g.estado,
    })));
    XLSX.utils.book_append_sheet(wb, wsGastos, "Presupuesto");

    const wsPagos = XLSX.utils.json_to_sheet(pagos.map((p) => ({
      Concepto: p.concepto, Cantidad: p.cantidad, Fecha: p.fecha, Método: p.metodo, Cuenta: p.cuenta,
      Partida: (gastos.find((g) => g.id === p.partida) || {}).c || "", Situación: p.situacion || "Realizado", Comentario: p.comentario || "",
    })));
    XLSX.utils.book_append_sheet(wb, wsPagos, "Pagos");

    const wsDev = XLSX.utils.json_to_sheet((devoluciones || []).map((d) => ({
      "A quién": d.quien, Cantidad: d.cantidad, Fecha: d.fecha || "", Comentario: d.comentario || "",
    })));
    XLSX.utils.book_append_sheet(wb, wsDev, "Devoluciones");

    const wsInv = XLSX.utils.json_to_sheet(guests.map((g) => ({
      Nombre: g.n, Sexo: g.sex, Familia: familiaLabel(familias, g.familia) || "", Despedida: g.desp, Menú: g.comida, Mesa: g.mesa ?? "",
      Confirmado: g.confirmado === "Si" ? "Sí" : g.confirmado === "No" ? "No" : "Pendiente",
      "Vía confirmación": g.origen === "Formulario" ? "Formulario RSVP" : g.origen === "Manual" ? "Manual / otro" : "Sin especificar",
    })));
    XLSX.utils.book_append_sheet(wb, wsInv, "Invitados");

    const wsFam = XLSX.utils.json_to_sheet(familias.map((f) => ({
      Familia: f.nombre, Miembros: guests.filter((g) => g.familia === f.id).map((g) => g.n).join(", "),
    })));
    XLSX.utils.book_append_sheet(wb, wsFam, "Familias");

    const wsBeb = XLSX.utils.json_to_sheet(bebidas.map((b) => ({ Bebida: b.bebida, Menciones: b.menciones, "Quién la pidió": b.quien })));
    XLSX.utils.book_append_sheet(wb, wsBeb, "Bebidas");

    const wsCan = XLSX.utils.json_to_sheet(canciones.map((c) => ({ Canción: c.cancion, Artista: c.artista, "Pedida por": c.quien })));
    XLSX.utils.book_append_sheet(wb, wsCan, "Canciones");

    const wsRev = XLSX.utils.json_to_sheet(revisar.map((r) => ({
      Caso: r.caso, "Respuesta original": r.original, Interpretación: r.interpretacion, "Qué revisar": r.accion, Estado: r.resuelto ? "Resuelto" : "Pendiente",
    })));
    XLSX.utils.book_append_sheet(wb, wsRev, "Revisar manualmente");

    XLSX.writeFile(wb, "boda_marga_ivan.xlsx");
  };

  const tabs = [
    { id: "finanzas", icon: "📊", label: "Finanzas" },
    { id: "gastos", icon: "💳", label: "Gastos" },
    { id: "invitados", icon: "👥", label: "Invitados" },
    { id: "mesas", icon: "🪑", label: "Mesas" },
    { id: "cuestionario", icon: "📋", label: "Cuestionario" },
  ];

  if (!loaded) {
    return (
      <div style={{ fontFamily: "-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif", background: C.bg, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: C.sub, fontSize: 14 }}>
        💍 Cargando datos de la boda…
      </div>
    );
  }

  return (
    <div style={{ fontFamily: "-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif", background: C.bg, minHeight: "100vh", color: C.text }}>
      {/* NAV */}
      <nav style={{ position: "sticky", top: 0, zIndex: 100, height: 56, background: C.card, borderBottom: `1px solid ${C.border}`, display: "flex", alignItems: "center", padding: "0 20px", gap: 8, boxShadow: "0 1px 8px rgba(0,0,0,.06)" }}>
        <div style={{ fontSize: 15, fontWeight: 700, color: C.rose, marginRight: 16, whiteSpace: "nowrap" }}>
          💍 Marga & Iván
        </div>
        <div className="boda-top-tabs" style={{ display: "flex", gap: 2, flex: 1, overflowX: "auto" }}>
          {tabs.map((t) => (
            <button
              key={t.id}
              onClick={() => setTab(t.id)}
              style={{
                padding: "7px 14px", border: "none", background: tab === t.id ? C.roseLight : "none",
                cursor: "pointer", fontSize: 13, fontWeight: 500,
                color: tab === t.id ? C.rose : C.sub, borderRadius: 8, whiteSpace: "nowrap",
                display: "flex", alignItems: "center", gap: 5,
              }}
            >
              <span>{t.icon}</span> {t.label}
            </button>
          ))}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          {saveStatus === "saving" && <span style={{ fontSize: 11, color: C.sub }}>Guardando…</span>}
          {saveStatus === "saved" && <span style={{ fontSize: 11, color: C.teal }}>✓ Sincronizado</span>}
          {saveStatus === "error" && <span style={{ fontSize: 11, color: C.red }}>⚠ Error al guardar</span>}
          <Btn
            small
            variant="ghost"
            onClick={() => setOcultarCantidades((v) => !v)}
            style={{ fontSize: 11 }}
            title={ocultarCantidades ? "Mostrar cantidades" : "Ocultar cantidades (para enseñar la pantalla sin que se vean los números)"}
          >
            {ocultarCantidades ? "🙈" : "👁"}
          </Btn>
          <Btn small variant="ghost" onClick={exportExcel} style={{ fontSize: 11 }} title="Descargar todo en Excel">⬇ Excel</Btn>
          <Btn small variant="ghost" onClick={refreshData} style={{ fontSize: 11 }} title="Cargar los últimos cambios">🔄</Btn>
          <Btn small variant="ghost" onClick={resetAll} style={{ fontSize: 11 }}>↺</Btn>
        </div>
      </nav>

      {/* PANELS */}
      <div className="boda-main-content" style={{ maxWidth: 1120, margin: "0 auto", padding: "20px 20px 48px" }}>
        <div style={{ margin: "0 0 16px" }}>
          <h1 style={{ fontSize: 20, fontWeight: 700 }}>
            {tabs.find((t) => t.id === tab)?.icon} {tabs.find((t) => t.id === tab)?.label}
          </h1>
          <p style={{ fontSize: 12, color: C.sub, marginTop: 2 }}>
            Cambios guardados automáticamente · Boda octubre 2026
          </p>
        </div>
        {tab === "finanzas" && <TabFinanzas gastos={gastos} guests={guests} pagos={pagos} devoluciones={devoluciones} />}
        {tab === "gastos" && <TabGastos gastos={gastos} setGastos={setGastos} pagos={pagos} setPagos={setPagos} devoluciones={devoluciones} setDevoluciones={setDevoluciones} guests={guests} familias={familias} />}
        {tab === "invitados" && <TabInvitados guests={guests} setGuests={setGuests} familias={familias} setFamilias={setFamilias} pagos={pagos} gastos={gastos} />}
        {tab === "mesas" && <TabMesas guests={guests} setGuests={setGuests} tablesConfig={tablesConfig} setTablesConfig={setTablesConfig} deleteMesa={deleteMesa} elementos={elementos} setElementos={setElementos} familias={familias} />}
        {tab === "cuestionario" && <TabCuestionario bebidas={bebidas} setBebidas={setBebidas} canciones={canciones} setCanciones={setCanciones} revisar={revisar} setRevisar={setRevisar} />}
      </div>

      {/* NAV MÓVIL: barra fija abajo, solo visible en pantallas estrechas (ver <style> del <head>) */}
      <nav className="boda-bottom-nav">
        {tabs.map((t) => (
          <button
            key={t.id}
            onClick={() => setTab(t.id)}
            style={{ color: tab === t.id ? C.rose : C.sub }}
          >
            <span className="boda-nav-icon">{t.icon}</span>
            <span>{t.label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<BodaApp />);
</script>
</body>
</html>
