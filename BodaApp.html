<!--
  Shim de window.storage: el componente fue escrito originalmente para el entorno
  de artefactos de Claude, que expone window.storage.get/set. Aquí lo sustituimos
  por llamadas a tu propia hoja de Google Sheets (vía un pequeño Apps Script publicado
  como "aplicación web"), para que los datos se compartan de verdad entre el móvil de
  Iván, el de Marga y el ordenador — ya no dependen del navegador de cada dispositivo.

  Como red de seguridad, cada guardado también se copia en localStorage: si en algún
  momento no hay conexión (o Google Sheets tarda/falla), la app sigue funcionando con
  esa última copia local y no se pierde nada — en cuanto vuelva la conexión, el próximo
  guardado o el botón "🔄 Recargar" vuelve a sincronizar con la hoja compartida.
-->
<script>
  const BODA_REMOTE_URL = "https://script.google.com/macros/s/AKfycbxj31fFJIqUKvbIgEUdQx_9PJ3c2aPif7c9BwqI6yzAzOdYNRLG-SP4Ztnyk6YIXpIy/exec";

  // Sube el valor local a la hoja de Google, en segundo plano (sin bloquear ni hacer fallar la
  // carga si la subida falla) — se usa para "sembrar" la hoja la primera vez que está vacía.
  const bodaSeedRemote = (value) => {
    fetch(BODA_REMOTE_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: value,
    }).catch((e) => console.error("No se pudo sembrar Google Sheets con los datos locales", e));
  };

  // Bloques que debería tener un estado completo de la app. Se usa solo para decidir, entre la copia
  // local y la de la hoja, cuál está más completa — nunca para leer/escribir datos de verdad.
  const BODA_CLAVES_ESPERADAS = [
    "gastos", "guests", "pagos", "devoluciones", "tablesConfig", "mesasEliminadas",
    "elementos", "familias", "bebidas", "canciones", "revisar",
  ];
  // Cuenta cuántos de esos bloques tiene el objeto Y con contenido de verdad (no vacío), para poder
  // comparar "cuál de las dos copias parece más completa" sin fiarnos a ciegas de quien responda antes.
  const bodaPuntuarCompletitud = (text) => {
    if (!text) return -1;
    let obj;
    try {
      obj = JSON.parse(text);
    } catch (e) {
      return -1; // JSON corrupto/cortado: puntuación mínima, nunca gana
    }
    if (!obj || typeof obj !== "object") return -1;
    return BODA_CLAVES_ESPERADAS.reduce((n, k) => {
      const v = obj[k];
      const tieneContenido = Array.isArray(v) ? v.length > 0 : v && typeof v === "object" ? Object.keys(v).length > 0 : !!v;
      return n + (tieneContenido ? 1 : 0);
    }, 0);
  };

  window.storage = {
    get: async (key) => {
      const local = localStorage.getItem(key);
      try {
        const res = await fetch(BODA_REMOTE_URL, { method: "GET", cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const text = await res.text();
        const trimmed = (text || "").trim();
        // Una hoja recién creada (o vaciada) devuelve "" o "{}" — NO es un estado real, así que no
        // debe pisar los datos que ya tuvieras guardados en este navegador. En ese caso usamos la
        // copia local (si existe) y de paso "sembramos" la hoja con ella para la próxima vez.
        if (!trimmed || trimmed === "{}") {
          if (local) bodaSeedRemote(local);
          return { value: local };
        }
        // No nos fiamos a ciegas de "lo que hay en la hoja manda": si la copia local que ya tenías en
        // este navegador tiene bloques con datos que la hoja NO tiene (p.ej. porque la hoja se quedó
        // con una versión antigua/incompleta guardada por error), nos quedamos con la local, que es
        // más completa, y volvemos a subir esa a la hoja. Solo dejamos que la hoja mande cuando es
        // igual de completa o más completa que la copia local (así sí llegan los cambios de otro
        // dispositivo/navegador).
        const puntosRemoto = bodaPuntuarCompletitud(text);
        const puntosLocal = bodaPuntuarCompletitud(local);
        if (puntosRemoto < puntosLocal) {
          console.warn(
            `Lo guardado en Google Sheets parece menos completo que la copia local de este navegador ` +
            `(hoja: ${puntosRemoto}/${BODA_CLAVES_ESPERADAS.length} bloques con datos, local: ${puntosLocal}/${BODA_CLAVES_ESPERADAS.length}). ` +
            `Uso la copia local y la vuelvo a subir a la hoja.`
          );
          if (local) bodaSeedRemote(local);
          return { value: local };
        }
        localStorage.setItem(key, text); // la hoja compartida es igual o más completa: refresca la copia local
        return { value: text };
      } catch (e) {
        console.error("No se pudo leer de Google Sheets, uso la copia local de respaldo", e);
        return { value: local };
      }
    },
    set: async (key, value) => {
      localStorage.setItem(key, value); // copia local de respaldo, siempre
      try {
        const res = await fetch(BODA_REMOTE_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" }, // evita el preflight CORS
          body: value,
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        return true;
      } catch (e) {
        console.error("No se pudo guardar en Google Sheets (se guardó solo en local)", e);
        return false;
      }
    },
  };
</script>

// Rellena mesas guardadas previamente (de antes de tener posición/confirmación) con los valores por
// defecto que falten, sin tocar nada que el usuario ya haya editado a mano (posición, aforo, nombre).
// `mesasEliminadas` es la lista de números de mesa que has borrado tú mismo a mano — se guarda aparte
// precisamente para que esta función no las vuelva a añadir en el próximo reload, tratándolas como
// "mesa nueva que aún no tenías". Sin esto, una mesa borrada volvía a aparecer porque no había forma de
// distinguir "nunca existió en tu sesión" de "existió y la borraste a propósito".
function mergeTablesConfigWithLatest(savedTC, mesasEliminadas = []) {
  const porMesa = {};
  savedTC.forEach((t) => { porMesa[t.mesa] = t; });
  const eliminadas = new Set(mesasEliminadas);
  const actualizadas = savedTC.map((t) => {
    const layout = MESAS_LAYOUT_DEFAULT[t.mesa] || { x: 50, y: 50 };
    return {
      ...t,
      x: t.x != null ? t.x : layout.x,
      y: t.y != null ? t.y : layout.y,
      confirmada: t.confirmada || false,
    };
  });
  // Añade mesas nuevas de MESAS_CONFIG_INIT (p.ej. la mesa 8) que aún no existieran en lo guardado —
  // pero nunca una que hayas borrado tú a propósito.
  const faltantes = MESAS_CONFIG_INIT.filter((t) => !porMesa[t.mesa] && !eliminadas.has(t.mesa));
  return [...actualizadas, ...faltantes];
}

function mergeElementosWithLatest(savedElementos) {
  const porId = {};
  savedElementos.forEach((e) => { porId[e.id] = e; });
  const actualizados = savedElementos.map((e) => {
    const def = ELEMENTOS_INIT.find((d) => d.id === e.id) || { x: 50, y: 50 };
    return { ...e, x: e.x != null ? e.x : def.x, y: e.y != null ? e.y : def.y };
  });
  const faltantes = ELEMENTOS_INIT.filter((e) => !porId[e.id]);
  return [...actualizados, ...faltantes];
}

// Parsea el campo `quien` de un pago de tipo ingreso: "guest:<id>" o "familia:<id>" → { tipo, id }.
function parseQuien(quien) {
  if (!quien) return null;
  const i = quien.indexOf(":");
  if (i < 0) return null;
  return { tipo: quien.slice(0, i), id: quien.slice(i + 1) };
}

// Cuánto ha regalado cada invitado, a partir de los pagos enlazados a partidas de tipo "ingreso"
// (p.ej. "Regalos") que tengan un `quien` asignado. Un regalo marcado a una familia entera se muestra
// con el mismo importe en cada miembro de esa familia (es un regalo conjunto, no repartido).
function regalosPorInvitado(guests, pagos, gastos) {
  const ingresoIds = new Set(gastos.filter((g) => g.tipo === "ingreso").map((g) => g.id));
  const map = {};
  pagos.forEach((p) => {
    if (!ingresoIds.has(p.partida)) return;
    const q = parseQuien(p.quien);
    if (!q) return;
    const cantidad = +p.cantidad || 0;
    if (q.tipo === "guest") {
      map[q.id] = (map[q.id] || 0) + cantidad;
    } else if (q.tipo === "familia") {
      guests.forEach((g) => { if (g.familia === q.id) map[g.id] = (map[g.id] || 0) + cantidad; });
    }
  });
  return map;
}

// dispositivos ni se guarda en Google Sheets, es solo para poder enseñar la pantalla sin que se vean
// los números). Se lee/escribe como variable de módulo para que fmt/fmt2 la reflejen al instante en
// cualquier sitio de la app sin tener que pasarla como prop por todos los componentes.
let OCULTAR_CANTIDADES = false;
const MASCARA = "••••";

const fmt = (n) =>
  OCULTAR_CANTIDADES ? MASCARA : "€" + Math.round(n).toLocaleString("es-ES");

const fmt2 = (n) =>

// Aportación mensual a la hucha boda (Iván ~1050 + Marga ~700)
const APORTACION_BODA = { Enero: 1250, Febrero: 1450, Marzo: 1750, Abril: 1750, Mayo: 1750, Junio: 1750, Julio: 1750, Agosto: 1750, Septiembre: 1750, Octubre: 1750 };
// El saldo inicial de la hucha Boda era 95€ (dato del Excel original), pero al reconciliar con el saldo
// real del banco (6.189,15€ el 11/08/2026) tras corregir los duplicados y añadir los gastos de Mago y
// Alianzas que faltaban, la única forma de que la cuenta salga exacta sin ningún ajuste manual es que el
// saldo inicial real fuera 1.300€, no 95€ — así lo confirma también la fila "Inicial" de tu Excel de
// seguimiento (pestaña "Evolución huchas", columna "Saldo T boda").
// Ya no se sigue la hucha Viajes (ni la hucha Casa, que nunca llegó a usarse) — solo queda la hucha Boda,
// que es la única relevante para lo que falta por planificar.
const SALDO_INICIAL = { Boda: 1300 };

// #1 — Pagado real por partida, derivado del registro de pagos
const pagadoPorPartida = (pagos) => {
  const m = {};
  pagos.forEach((p) => { if (p.partida) m[p.partida] = (m[p.partida] || 0) + (+p.cantidad || 0); });
  return m;
};

// Mes (nombre) a partir de una fecha ISO
const mesDeFecha = (iso) => {
  if (!iso) return null;
  const idx = parseInt(iso.split("-")[1], 10) - 1;
  return MESES_ORDEN[idx] || null;
};

// #2 — Evolución REAL del saldo de la hucha boda, mes a mes, a partir del único registro que existe
// ahora: los pagos. Cada pago que sale/entra de la cuenta "BBVA Boda" mueve la hucha; el signo (resta si
// es un gasto, suma si es un ingreso como "Regalos") lo decide el tipo de la partida a la que está
// enlazado, no el pago en sí — así no hace falta un registro aparte de "movimientos".
const saldoRealHucha = (hucha, pagos, gastos) => {
  const aport = hucha === "Boda" ? APORTACION_BODA : {};
  const tipoPorPartida = {};
  (gastos || []).forEach((g) => { tipoPorPartida[g.id] = g.tipo || "gasto"; });
  const movPorMes = {};
  MESES_ORDEN.forEach((mes) => { movPorMes[mes] = 0; });
  pagos.forEach((p) => {
    if (hucha !== "Boda" || !/bbva boda/i.test(p.cuenta)) return;
    const mes = mesDeFecha(p.fecha);
    if (!mes || movPorMes[mes] === undefined) return;
    const esIngreso = tipoPorPartida[p.partida] === "ingreso";
    movPorMes[mes] += esIngreso ? (+p.cantidad || 0) : -(+p.cantidad || 0);
  });
  // Recorrido acumulado hasta el mes actual (marzo 2026 → mostramos hasta el mes con datos)
  let saldo = SALDO_INICIAL[hucha] || 0;
  const serie = [{ mes: "Inicial", saldo }];
  MESES_ORDEN.slice(0, 10).forEach((mes) => {
    saldo += (aport[mes] || 0) + (movPorMes[mes] || 0);
    serie.push({ mes: mes.slice(0, 3), saldo: Math.round(saldo) });
  });
  return serie;
};

// Detalle de los pagos que mueven la hucha Boda cada mes (para el tooltip de la gráfica): por cada mes
// abreviado ("Ene", "Feb"...) devuelve la lista de conceptos con su importe con signo (negativo si es un
// gasto, positivo si es un ingreso como "Regalos") y, si hay aportación mensual ese mes, la incluye
// también como una línea más.
function detallePorMesHucha(hucha, pagos, gastos) {
  const aport = hucha === "Boda" ? APORTACION_BODA : {};
  const tipoPorPartida = {};
  (gastos || []).forEach((g) => { tipoPorPartida[g.id] = g.tipo || "gasto"; });
  const porMes = {};
  MESES_ORDEN.forEach((mes) => { porMes[mes.slice(0, 3)] = []; });
  MESES_ORDEN.forEach((mes) => {
    if (aport[mes]) porMes[mes.slice(0, 3)].push({ concepto: "Aportación mensual", importe: aport[mes] });
  });
  pagos.forEach((p) => {
    if (hucha !== "Boda" || !/bbva boda/i.test(p.cuenta)) return;
    const mes = mesDeFecha(p.fecha);
    if (!mes) return;
    const esIngreso = tipoPorPartida[p.partida] === "ingreso";
    const importe = esIngreso ? (+p.cantidad || 0) : -(+p.cantidad || 0);
    porMes[mes.slice(0, 3)].push({ concepto: p.concepto, importe });
  });
  return porMes;
}

async function loadState() {
  try {
    const res = await window.storage.get("boda-app-state", true);
    if (res?.value) return JSON.parse(res.value);
  } catch (e) { /* no existe aún */ }
  return null;
}
async function saveState(state) {

    await window.storage.set("boda-app-state", JSON.stringify(state), true);
    return true;
  } catch (e) {
    console.error("Error guardando", e);
    return false;
  }
}

// Migración: los invitados guardados en tu navegador son de ANTES de importar el cuestionario RSVP
// (no tienen "familia" ni las confirmaciones/menús que se han deducido de las respuestas). Esta función
// rellena SOLO lo que faltaba (familia, notas, confirmaciones que seguían pendientes, la corrección puntual
// del menú de Mar Ander) sin tocar nada que hayas editado tú a mano — mesas, invitados añadidos, o
// confirmaciones/menús que ya hubieras cambiado manualmente por tu cuenta.
function mergeGuestsWithLatest(savedGuests) {
  const byName = {};
  GUESTS_INIT.forEach((g) => { byName[g.n] = g; });
  const merged1 = savedGuests.map((g) => {
    const latest = byName[g.n];
    if (!latest) return g; // invitado añadido a mano, no estaba en la importación
    const merged = { ...g };
    if (latest.familia && !merged.familia) merged.familia = latest.familia;
    if (latest.nota && !merged.nota) merged.nota = latest.nota;
    if (latest.origen && !merged.origen) merged.origen = latest.origen; // marca "Formulario" solo si no tenías nada puesto
    if (!merged.confirmado && latest.confirmado) merged.confirmado = latest.confirmado; // solo si seguía pendiente
    if (merged.n === "Mar Ander" && merged.comida === "Pescado/Marisco" && latest.comida !== "Pescado/Marisco") {
      merged.comida = latest.comida; // corrección puntual, solo si no la cambiaste ya tú mismo
    }
    return merged;
  });
  // Corrección: en una versión anterior, "Mama" y "Papa" (los padres de Marga) se marcaron por error como
  // confirmados por formulario — el formulario lo habían respondido los padres de Iván, que ahora son las
  // partidas separadas "Mama (I)" / "Papa (I)". Como el merge de arriba nunca pisa una confirmación que ya
  // esté puesta, ese error se quedaba para siempre aunque la fuente original ya estuviera corregida. Esto
  // lo revierte: si siguen exactamente en ese estado erróneo (confirmado "Sí" + vía "Formulario", nunca
  // tocados a mano de otra forma), los deja como pendientes de verdad, tal y como están sus padres.
  return merged1.map((g) => {
    if ((g.n === "Mama" || g.n === "Papa") && g.confirmado === "Si" && g.origen === "Formulario") {
      const { origen, ...resto } = g;
      return { ...resto, confirmado: "" };
    }
    return g;
  });
}

// Migración: añade a tus familias guardadas cualquier familia NUEVA que hayamos deducido del cuestionario
// (p.ej. F24 Jose & Abuela Demetria) sin tocar ni borrar familias que ya tuvieras creadas o renombradas a mano.
function mergeFamiliasWithLatest(savedFamilias) {
  const savedIds = new Set(savedFamilias.map((f) => f.id));
  const nuevas = FAMILIAS_INIT.filter((f) => !savedIds.has(f.id));
  return nuevas.length ? [...savedFamilias, ...nuevas] : savedFamilias;
}

// Migración: reconcilia los casos "a revisar" guardados con las últimas correcciones (p.ej. el caso de
// "Ia Abuela" ya resuelto como Jose + Abuela Demetria). Si ya lo tenías marcado como resuelto (a mano) o
// lo resolvimos nosotros en esta actualización, queda resuelto; nunca lo reabre. Los textos (caso/accion/
// interpretacion) se actualizan solo cuando el caso pasa a resuelto en esta versión, para que veas el motivo;
// cualquier nota que hayas añadido tú a mano (id que no exista en la versión importada) se conserva igual.
function mergeRevisarWithLatest(savedRevisar) {
  const byId = {};
  REVISAR_INIT.forEach((r) => { byId[r.id] = r; });
  const merged = savedRevisar.map((r) => {
    const latest = byId[r.id];
    if (!latest) return r; // nota añadida a mano, no estaba en la importación
    const resuelto = r.resuelto || latest.resuelto;
    if (resuelto && !r.resuelto && latest.resuelto) {
      // se acaba de resolver en esta actualización: toma el texto explicativo más reciente
      return { ...latest, resuelto: true };
    }
    return { ...r, resuelto };
  });
  const savedIds = new Set(savedRevisar.map((r) => r.id));
  const nuevos = REVISAR_INIT.filter((r) => !savedIds.has(r.id));
  return nuevos.length ? [...merged, ...nuevos] : merged;
}

// Migración única: la app ya no tiene un "Registro de movimientos de huchas" separado del de pagos —
// todo (incluidos los ingresos como regalos) es ahora un "pago" enlazado a una partida de Gastos, y el
// tipo de esa partida ("gasto" o "ingreso") decide si suma o resta de la hucha. Si tu navegador guardó
// una sesión de antes de este cambio, esta función convierte lo que quedaba en `movimientos` a pagos:
// - Todo lo de la hucha Viajes (y Casa, que nunca se usó) se descarta: ya no se sigue ese dinero aquí.
// - "Regalo Yoya" (+800, hucha Boda) no se migra aquí porque ya llega directamente en PAGOS_INIT.
// - El antiguo "Ajuste de conciliación con saldo bancario real" (+895, provisional) tampoco se migra:
//   ya no hace falta ningún ajuste a mano, porque se encontraron y corrigieron las dos causas reales
//   de esa diferencia (saldo inicial real de la hucha Boda + los gastos de Mago/Alianzas que faltaban).
//   Migrarlo colaría un ingreso fantasma de 895€ y volvería a descuadrar la cuenta.
// - Cualquier otro movimiento que hayáis añadido vosotros a mano en la hucha Boda se convierte en un
//   pago: si era un ingreso (importe positivo) se enlaza a la partida "Regalos"; si era un gasto
//   (importe negativo) se deja sin partida para que lo clasifiquéis vosotros desde la pestaña Gastos.
function fechaAproxDeMes(mes, anio = 2026) {
  const idx = MESES_ORDEN.indexOf(mes);
  const mm = String((idx >= 0 ? idx : 0) + 1).padStart(2, "0");
  return `${anio}-${mm}-15`;
}
function migrarMovimientosAPagos(savedMovimientos, gastosActuales) {
  if (!savedMovimientos || !savedMovimientos.length) return [];
  const regalosId = (gastosActuales.find((g) => g.tipo === "ingreso") || {}).id || "";
  return savedMovimientos
    .filter((m) => m.hucha === "Boda")
    .filter((m) => !(m.concepto === "Regalo Yoya" && Math.abs(+m.importe || 0) === 800))
    .filter((m) => !(m.concepto && m.concepto.startsWith("Ajuste de conciliación con saldo bancario real")))
    .map((m, i) => {
      const importe = +m.importe || 0;
      return {
        concepto: m.concepto,
        cantidad: Math.abs(importe),
        fecha: fechaAproxDeMes(m.mes),
        metodo: "Otro",
        cuenta: "BBVA Boda",
        partida: importe > 0 ? regalosId : "",
        comentario: 'Migrado automáticamente desde el antiguo "Registro de movimientos de huchas"',
        id: "pago_migrado_" + i,
      };
    });
}

// Limpieza defensiva: si tu navegador llegó a ejecutar la migración de arriba ANTES de que excluyera el
// "Ajuste de conciliación" (versión con ese bug), puede que ya tengas guardado un pago fantasma de 895€
// en la partida "Regalos" con este comentario. Esta función lo quita del registro de pagos.
function limpiarAjusteFantasma(savedPagos) {
  return savedPagos.filter((p) => !(p.concepto && p.concepto.startsWith("Ajuste de conciliación con saldo bancario real")));
}

// Migración: añade al registro de pagos guardado cualquier pago nuevo de PAGOS_INIT que todavía no
// tengas (por ejemplo, el 50% del catering pagado el 11/08/2026 con el regalo en efectivo de la familia
// de Marga + el resto de la hucha), sin duplicar nada que ya tuvieras ni tocar pagos añadidos a mano.
function mergePagosWithLatest(savedPagos) {
  const clave = (p) => `${p.concepto}|${p.cantidad}|${p.partida}`;
  const savedKeys = new Set(savedPagos.map(clave));
  const nuevos = PAGOS_INIT.filter((p) => !savedKeys.has(clave(p)));
  return nuevos.length ? [...savedPagos, ...nuevos] : savedPagos;
}

// Migración: (1) actualiza partidas concretas cuyo importe estimado ya se ha corregido por uno real
// (solo si sigues en el valor antiguo — si ya lo cambiaste tú a mano, no lo toca), y (2) añade partidas
// nuevas de GASTOS_INIT que no existían todavía (p.ej. "Mago", un gasto real que faltaba en el presupuesto).
function mergeGastosWithLatest(savedGastos) {
  const CORRECCIONES = [
    { id: "g2", siSigueEn: 10000, nuevo: { total: 9848, estado: (e) => (e === "Reservado" ? "Confirmado" : e) } },
    { id: "g13", siSigueEn: 150, nuevo: { total: 160 } },
    { id: "g16", siSigueEn: 150, nuevo: { total: 300 } },
  ];
  const merged = savedGastos.map((g) => {
    const c = CORRECCIONES.find((x) => x.id === g.id && x.siSigueEn === g.total);
    if (!c) return g;
    const cambios = { ...c.nuevo };
    if (typeof cambios.estado === "function") cambios.estado = cambios.estado(g.estado);
    return { ...g, ...cambios };
  });
  const savedIds = new Set(savedGastos.map((g) => g.id));
  const nuevos = GASTOS_INIT.filter((g) => !savedIds.has(g.id));
  return nuevos.length ? [...merged, ...nuevos] : merged;
}

// Migración: si añadiste a mano una partida "Mago" antes de que la app trajera la suya propia (g16), te
// habrán quedado dos filas con el mismo concepto. Esta función las fusiona en una sola (la de la app si
// está entre ellas, o si no la primera que encuentre), repunta a esa cualquier pago que estuviera enlazado
// a la partida que se elimina, y fija el total real: 300€, de los que ya hay 150€ pagados. Al repuntar,
// si el pago de tu partida manual coincidía en concepto+cantidad con el pago que trae la app por defecto
// para "g16" (mismo pago real, contado dos veces), se queda solo con uno para no duplicar lo pagado.
function fusionarPartidasDuplicadas(gastos, pagos, concepto) {
  const dup = gastos.filter((g) => (g.c || "").trim().toLowerCase() === concepto.toLowerCase());
  if (dup.length < 2) return { gastos, pagos, cambiado: false };
  const canonical = dup.find((g) => g.id === "g16") || dup[0];
  const idsAEliminar = new Set(dup.filter((g) => g.id !== canonical.id).map((g) => g.id));
  const gastosFusionados = gastos
    .filter((g) => !idsAEliminar.has(g.id))
    .map((g) => (g.id === canonical.id ? { ...g, total: 300 } : g));
  const pagosRepuntados = pagos.map((p) => (idsAEliminar.has(p.partida) ? { ...p, partida: canonical.id } : p));
  // Quita duplicados exactos (mismo concepto + cantidad + partida) que puedan haber quedado tras
  // repuntar dos pagos que en realidad eran el mismo cobro contado por dos caminos distintos.
  const vistos = new Set();
  const pagosSinDuplicar = pagosRepuntados.filter((p) => {
    const clave = `${p.concepto}|${p.cantidad}|${p.partida}`;
    if (p.partida !== canonical.id || !vistos.has(clave)) {
      vistos.add(clave);
      return true;
    }
    return false;
  });
  return { gastos: gastosFusionados, pagos: pagosSinDuplicar, cambiado: true };
}

// Como <Select>, pero con un cuadro de texto encima: al escribir filtra las opciones por lo que
// coincida (útil cuando la lista es larga, como las familias) en vez de tener que desplazarse por
// un desplegable nativo entero para encontrar la que buscas.
function SelectBuscable({ value, onChange, options, placeholder, style }) {
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState("");
  const wrapRef = useRef(null);
  const selected = options.find((o) => (o.value ?? o) === value);
  const displayValue = open ? query : (selected ? (selected.label ?? selected) : "");

  useEffect(() => {
    if (!open) return;
    const onDocClick = (e) => {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) { setOpen(false); setQuery(""); }
    };
    document.addEventListener("mousedown", onDocClick);
    return () => document.removeEventListener("mousedown", onDocClick);
  }, [open]);

  const filtered = options.filter((o) => {
    const label = (o.label ?? o).toString().toLowerCase();
    return !query || label.includes(query.toLowerCase());
  });

  return (
    <div ref={wrapRef} style={{ position: "relative", ...style }}>
      <input
        value={displayValue}
        placeholder={placeholder}
        onFocus={() => { setOpen(true); setQuery(""); }}
        onChange={(e) => { setQuery(e.target.value); setOpen(true); }}
        style={{ width: "100%", boxSizing: "border-box", padding: "7px 10px", border: `1px solid ${C.grayMid}`, borderRadius: 8, fontSize: 13, background: C.card, color: C.text, outline: "none" }}
      />
      {open && (
        <div style={{
          position: "absolute", top: "100%", left: 0, right: 0, zIndex: 40, marginTop: 2,
          background: C.card, border: `1px solid ${C.grayMid}`, borderRadius: 8, maxHeight: 220, overflowY: "auto",
          boxShadow: "0 4px 14px rgba(0,0,0,0.14)",
        }}>
          {filtered.length === 0 && <div style={{ padding: "8px 10px", fontSize: 12, color: C.sub }}>Sin resultados</div>}
          {filtered.map((o) => {
            const val = o.value ?? o;
            const label = o.label ?? o;
            return (
              <div
                key={val}
                onMouseDown={(e) => { e.preventDefault(); onChange(val); setOpen(false); setQuery(""); }}
                style={{
                  padding: "7px 10px", fontSize: 13, cursor: "pointer",
                  background: val === value ? C.roseLight : "transparent", color: val === value ? C.rose : C.text,
                }}
              >
                {label}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// Gráfico de líneas en SVG (sin librerías externas) — con relleno bajo la línea real, marca de "Hoy",
// etiqueta del último valor y un tooltip nativo (al pasar el ratón por cada punto) con el importe exacto.
function LineChartSVG({ series, height = 230, hoyMes, detalleMes }) {
  const [hover, setHover] = useState(null); // índice del punto sobre el que está el ratón/dedo
  const W = 760, H = height, padL = 56, padR = 18, padT = 26, padB = 28;
  const all = series.flatMap((s) => s.data.map((d) => d.saldo));
  const maxRaw = Math.max(1, ...all);
  const minRaw = Math.min(0, ...all);
  // Redondea el rango a "pasos" bonitos (1/2/5 × 10^n) para que las líneas de la cuadrícula caigan en
  // números fáciles de leer (2.000€, 5.000€…) en vez de fracciones raras.
  const step = (() => {
    const rough = (maxRaw - minRaw) / 4 || 1;
    const mag = Math.pow(10, Math.floor(Math.log10(rough)));
    const norm = rough / mag;
    return (norm >= 5 ? 5 : norm >= 2 ? 2 : 1) * mag;
  })();
  const maxV = Math.ceil(maxRaw / step) * step;
  const minV = Math.floor(minRaw / step) * step;
  const range = maxV - minV || 1;
  const labels = series[0].data.map((d) => d.mes);
  const n = labels.length;
  const x = (i) => padL + (i * (W - padL - padR)) / (n - 1);
  const y = (v) => padT + (1 - (v - minV) / range) * (H - padT - padB);
  const yTicks = Math.round(range / step);
  const hoyIdx = hoyMes ? labels.indexOf(hoyMes) : -1;
  const mainSeries = series.find((s) => !s.dashed) || series[0];
  const lastPoint = mainSeries.data[mainSeries.data.length - 1];
  const gradId = "huchaFill" + mainSeries.color.replace("#", "");
  const hoverPoint = hover != null ? mainSeries.data[hover] : null;
  const hoverMovs = hoverPoint && detalleMes ? (detalleMes[hoverPoint.mes] || []) : [];
  const hoverTotal = hoverMovs.reduce((s, m) => s + m.importe, 0);
  // Posición del tooltip como % del viewBox, para poder colocarlo con CSS encima del SVG responsive
  // (que escala con el ancho del contenedor) sin tener que medir píxeles reales.
  const leftPct = hoverPoint ? (x(hover) / W) * 100 : 0;
  const topPct = hoverPoint ? (y(hoverPoint.saldo) / H) * 100 : 0;

  return (
    <div style={{ position: "relative" }}>
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }}
      onMouseLeave={() => setHover(null)}>
      <defs>
        <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={mainSeries.color} stopOpacity="0.22" />
          <stop offset="100%" stopColor={mainSeries.color} stopOpacity="0" />
        </linearGradient>
      </defs>

      {Array.from({ length: yTicks + 1 }).map((_, i) => {
        const v = minV + step * i;
        const yy = y(v);
        return (
          <g key={i}>
            <line x1={padL} y1={yy} x2={W - padR} y2={yy} stroke="rgba(0,0,0,0.07)" />
            <text x={padL - 8} y={yy + 3} textAnchor="end" fontSize="11" fill="#6B6965">{fmt(v)}</text>
          </g>
        );
      })}

      {hoyIdx > 0 && (
        <g>
          <line x1={x(hoyIdx)} y1={padT - 6} x2={x(hoyIdx)} y2={H - padB} stroke="#B06D15" strokeWidth="1.4" strokeDasharray="3,3" opacity="0.65" />
          <text x={x(hoyIdx)} y={padT - 12} textAnchor="middle" fontSize="10" fontWeight="700" fill="#B06D15">Hoy</text>
        </g>
      )}

      {(() => {
        const areaPath = mainSeries.data.map((d, i) => `${i === 0 ? "M" : "L"}${x(i)},${y(d.saldo)}`).join(" ")
          + ` L${x(n - 1)},${y(minV)} L${x(0)},${y(minV)} Z`;
        return <path d={areaPath} fill={`url(#${gradId})`} stroke="none" />;
      })()}

      {series.map((s, si) => {
        const path = s.data.map((d, i) => `${i === 0 ? "M" : "L"}${x(i)},${y(d.saldo)}`).join(" ");
        return (
          <g key={si}>
            {s.dashed ? (
              <path d={path} fill="none" stroke={s.color} strokeWidth="1.8" strokeDasharray="5,4" opacity="0.55" />
            ) : (
              <path d={path} fill="none" stroke={s.color} strokeWidth="2.5" />
            )}
            {!s.dashed && s.data.map((d, i) => (
              <g key={i}>
                <circle
                  cx={x(i)} cy={y(d.saldo)}
                  r={i === hoyIdx ? 5 : (i === hover ? 5.5 : 3.2)}
                  fill={i === hoyIdx ? "#B06D15" : s.color}
                  stroke="#fff" strokeWidth={i === hoyIdx || i === hover ? 1.5 : 1}
                />
                {/* Círculo invisible más grande, para que sea fácil acertar con el ratón o el dedo */}
                <circle
                  cx={x(i)} cy={y(d.saldo)} r={12} fill="transparent"
                  style={{ cursor: "pointer" }}
                  onMouseEnter={() => setHover(i)}
                  onClick={() => setHover(hover === i ? null : i)}
                />
              </g>
            ))}
          </g>
        );
      })}

      {labels.map((lb, i) => (
        <text key={i} x={x(i)} y={H - 8} textAnchor="middle" fontSize="10.5" fill={i === hoyIdx ? "#B06D15" : "#6B6965"} fontWeight={i === hoyIdx ? 700 : 400}>{lb}</text>
      ))}

      <text x={Math.min(x(n - 1), W - padR - 4)} y={Math.max(y(lastPoint.saldo) - 10, padT + 10)} textAnchor="end" fontSize="12" fontWeight="700" fill={mainSeries.color}>
        {fmt(lastPoint.saldo)}
      </text>
    </svg>

    {hoverPoint && (
      <div
        style={{
          position: "absolute",
          left: `${leftPct}%`, top: `${topPct}%`,
          transform: `translate(${leftPct > 75 ? "-100%" : leftPct < 8 ? "0%" : "-50%"}, -100%) translateY(-14px)`,
          background: "#26241F", color: "#fff", borderRadius: 10, padding: "10px 12px",
          fontSize: 11.5, whiteSpace: "nowrap", pointerEvents: "none", zIndex: 10,
          boxShadow: "0 6px 18px rgba(0,0,0,.28)", minWidth: 170,
        }}
      >
        <div style={{ fontWeight: 700, marginBottom: hoverMovs.length ? 6 : 0, fontSize: 12.5 }}>
          {hoverPoint.mes === "Inicial" ? "Saldo de partida" : hoverPoint.mes} · {fmt(hoverPoint.saldo)}
        </div>
        {hoverMovs.length > 0 && (
          <div style={{ borderTop: "1px solid rgba(255,255,255,.15)", paddingTop: 6, display: "flex", flexDirection: "column", gap: 3 }}>
            {hoverMovs.map((m, idx) => (
              <div key={idx} style={{ display: "flex", justifyContent: "space-between", gap: 10 }}>
                <span style={{ opacity: 0.9 }}>{m.concepto}</span>
                <span style={{ color: m.importe < 0 ? "#FF9E9E" : "#82E3B4", fontWeight: 600 }}>
                  {m.importe < 0 ? "−" : "+"}{fmt(Math.abs(m.importe))}
                </span>
              </div>
            ))}
            <div style={{ display: "flex", justifyContent: "space-between", gap: 10, borderTop: "1px solid rgba(255,255,255,.15)", marginTop: 3, paddingTop: 4, fontWeight: 700 }}>
              <span>Movimiento del mes</span>
              <span style={{ color: hoverTotal < 0 ? "#FF9E9E" : "#82E3B4" }}>
                {hoverTotal < 0 ? "−" : "+"}{fmt(Math.abs(hoverTotal))}
              </span>
            </div>
          </div>
        )}
        {hoverMovs.length === 0 && hoverPoint.mes !== "Inicial" && (
          <div style={{ opacity: 0.7, fontSize: 11 }}>Sin movimientos este mes</div>
        )}
      </div>
    )}
    </div>
  );
}

function TabFinanzas({ gastos, guests, pagos, devoluciones }) {
  const [luna, setLuna] = useState(9848); // coste final ya confirmado de la luna de miel

  const paidMap = pagadoPorPartida(pagos);
  // Lo que ya se debe a los padres de Iván (préstamo del 11/08/2026 para el catering) menos lo que ya
  // se les haya ido devolviendo — mismo cálculo que en la pestaña Gastos, aquí solo para el aviso.
  const debePadres = Math.max(0, pagos.filter((p) => cuentaPersona(p.cuenta) === "Padres").reduce((s, p) => s + (+p.cantidad || 0), 0)
    - (devoluciones || []).filter((d) => d.quien === "Padres").reduce((s, d) => s + (+d.cantidad || 0), 0));
  // Los KPIs de presupuesto/pagado solo cuentan partidas de tipo "gasto" — los "ingresos" (p.ej.
  // "Regalos") no son un gasto que haya que cubrir, así que no deben inflar el presupuesto total.
  const gastosPartidas = gastos.filter((g) => g.tipo !== "ingreso");
  const totalPres = gastosPartidas.reduce((s, g) => s + g.total, 0);
  const totalPaid = gastosPartidas.reduce((s, g) => s + (paidMap[g.id] || 0), 0);  // #1 pagado real
  // Regalos ya recibidos en efectivo (familia de Marga, Yoya si la cobrasteis en mano, etc.) que NO han
  // pasado por la cuenta BBVA Boda: se calcula en vivo como ingresos menos gastos de la cuenta
  // "Efectivo", para que cuente automáticamente tanto lo recibido como lo que ya se haya gastado de ahí
  // (p.ej. si el regalo de la familia de Marga se llega a usar en otra cosa, deja de contarse aquí solo
  // porque ya estaría dentro de totalPaid). El regalo de Yoya que SÍ pasó por BBVA Boda no se repite
  // aquí — ya suma directamente al saldo de la hucha (huchaOct, más abajo).
  const tipoPorPartidaFin = {};
  gastos.forEach((g) => { tipoPorPartidaFin[g.id] = g.tipo || "gasto"; });
  const efectivoDisponible = pagos.filter((p) => /^efectivo$/i.test((p.cuenta || "").trim())).reduce((s, p) => {
    const esIngreso = tipoPorPartidaFin[p.partida] === "ingreso";
    return s + (esIngreso ? (+p.cantidad || 0) : -(+p.cantidad || 0));
  }, 0);
  // Solo queda como recurso todavía pendiente (no recibido) el regalo de la familia de Iván, confirmado
  // para antes de la boda.
  const familias = 6918.45;
  const cubierto = totalPaid + familias + efectivoDisponible;
  const pendienteReal = totalPres - cubierto;
  // Saldo real de la hucha boda proyectado a octubre — se recalcula en vivo desde el único registro que
  // existe ahora (los pagos, cada uno enlazado a una partida), en vez de quedarse fijo en un número que
  // se desactualiza con cada pago nuevo.
  const serieBoda = saldoRealHucha("Boda", pagos, gastos);
  const huchaOct = (serieBoda.find((d) => d.mes === "Oct") || {}).saldo || 0;
  const gap = Math.max(0, pendienteReal - huchaOct);
  // Pendiente real de la partida Catering (para el hito "Resto catering"), en vivo desde sus pagos.
  const restoCatering = Math.max(0, ((gastos.find((g) => g.id === "g1") || {}).total || 0) - (paidMap["g1"] || 0));
  // Detalle de pagos/aportaciones por mes, para el tooltip de la gráfica (qué se movió ese mes).
  const detalleBoda = detallePorMesHucha("Boda", pagos, gastos);

  // Adultos que asisten = no han rechazado y no son niños ni "No"
  const asisten = guests.filter((g) => g.confirmado !== "No" && g.comida !== "No");
  const nAdultos = asisten.filter((g) => g.comida !== "Niño").length;
  const nConfirmados = guests.filter((g) => g.confirmado === "Si").length;
  const regalosMin = nAdultos * 180;

  const ahorroLuna = 9848 - luna;
  const prestamoAjustado = Math.max(0, gap - ahorroLuna);
  // Lo que hay que devolver en total con los sobres de la boda: lo ya prestado por los padres
  // (debePadres) más el préstamo adicional (si hiciera falta cubrir el resto del presupuesto).
  const prestamoTotal = debePadres + prestamoAjustado;
  const scBase = regalosMin - prestamoTotal;
  const scCons = regalosMin - (debePadres + gap);

  const pct = (x) => ((x / totalPres) * 100).toFixed(1);

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(160px,1fr))", gap: 12, marginBottom: 16 }}>
        <KPI label="Presupuesto total" value={fmt(totalPres)} sub={`${gastosPartidas.length} partidas`} color={C.rose} />
        <KPI label="Cubierto" value={fmt(cubierto)} sub={`${pct(cubierto)}% del total`} color={C.teal} />
        <KPI label="Pendiente real" value={fmt(pendienteReal)} sub={`${pct(pendienteReal)}% restante`} color={C.red} />
        <KPI label="Préstamo adicional necesario" value={fmt(gap)} sub="Por encima del préstamo padres ya pedido" color={C.purple} />
        <KPI label="Regalos estimados" value={fmt(regalosMin)} sub={`${nAdultos} adultos × ${fmt(180)} · ${nConfirmados} confirm.`} color={C.teal} />
        <KPI label="Debéis a los padres" value={fmt(debePadres)} sub="Préstamo catering, 11 ago 2026" color={C.amber} />
      </div>

      <Card title={`Cobertura financiera — ${fmt(totalPres)}`} style={{ marginBottom: 14 }}>
        <div style={{ height: 20, background: C.grayLight, borderRadius: 10, overflow: "hidden", display: "flex", marginBottom: 10 }}>
          <div style={{ width: pct(totalPaid) + "%", background: C.teal }} title={`Pagado ${fmt(totalPaid)}`} />
          <div style={{ width: pct(efectivoDisponible) + "%", background: C.amber }} title={`Efectivo ya recibido, sin gastar (familia Marga, etc.) ${fmt(efectivoDisponible)}`} />
          <div style={{ width: pct(6918.45) + "%", background: "#5DCAA5" }} title="Familia Iván (a confirmar fecha)" />
          <div style={{ width: pct(huchaOct) + "%", background: "#AFA9EC" }} title="Hucha boda oct" />
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: "5px 16px", fontSize: 11, color: C.sub }}>
          {[
            [C.teal, `Pagado ${fmt(totalPaid)}`],
            [C.amber, `Efectivo sin gastar ${fmt(efectivoDisponible)} (familia Marga, etc.)`],
            ["#5DCAA5", `Familia Iván ${fmt(6918.45)} (a confirmar fecha)`],
            ["#AFA9EC", `Hucha boda (oct) ${fmt(huchaOct)}`],
            [C.grayLight, `Sin cubrir ${fmt(gap)}`],
          ].map(([col, lbl], i) => (
            <span key={i} style={{ display: "flex", alignItems: "center", gap: 4 }}>
              <span style={{ width: 9, height: 9, borderRadius: 2, background: col, border: col === C.grayLight ? "1px solid #ccc" : "none", display: "inline-block" }} />
              {lbl}
            </span>
          ))}
        </div>
      </Card>

      <Card title="📈 Evolución real de la hucha boda (calculada desde el registro de pagos)" style={{ marginBottom: 14 }}>
        <LineChartSVG
          hoyMes={MES_ACTUAL_ABREV}
          detalleMes={detalleBoda}
          series={[
            { data: serieBoda, color: C.rose },
            { data: [1300, 2550, 4000, 5750, 7500, 9250, 11000, 12750, 14500, 16250, 18000].map((v, i) => ({ mes: ["Ini", "Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct"][i], saldo: v })), color: C.roseMid, dashed: true },
          ]}
        />
        <div style={{ display: "flex", flexWrap: "wrap", gap: 14, fontSize: 11, color: C.sub, marginTop: 8 }}>
          <span style={{ display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 10, height: 3, background: C.rose, display: "inline-block" }} />Real (desde vuestro registro de pagos)</span>
          <span style={{ display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 10, height: 3, background: C.roseMid, display: "inline-block" }} />Teórica (proyección original del Excel)</span>
          <span style={{ display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 8, height: 8, borderRadius: "50%", background: "#B06D15", display: "inline-block" }} />Hoy</span>
        </div>
        <div style={{ marginTop: 10, padding: "9px 13px", background: C.grayLight, borderRadius: 8, fontSize: 12, color: C.sub }}>
          Esta curva se recalcula sola con cada pago que registréis (gastos y también ingresos, como los regalos recibidos). La aportación mensual a la hucha boda es de {fmt(1750)} (Iván ~{fmt(1050)} + Marga ~{fmt(700)}). Pasa el ratón (o toca, en el móvil) por cualquier punto para ver el detalle de ese mes: la aportación, cada gasto o ingreso, y el saldo resultante.
        </div>
      </Card>

      <Card title="🤝 Simulación del préstamo familiar" style={{ marginBottom: 14 }}>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(280px,1fr))", gap: 20 }}>
          <div>
            <div style={{ fontSize: 12, color: C.sub, marginBottom: 12 }}>Flujo de caja previsto</div>
            {[
              { icon: "✅", date: "11 agosto — ya hecho", title: "Catering 50% señal (préstamo padres)", amt: `–${fmt(7919.73)}`, color: C.amber },
              { icon: "🤝", date: "Si hace falta", title: "Préstamo adicional (más allá del de los padres)", amt: `+${fmt(prestamoAjustado)}`, color: C.purple },
              { icon: "✈️", date: "Antes de julio", title: `Cerrar luna de miel (${fmt(luna)})`, amt: `–${fmt(luna - 2000)} restante`, color: C.purple },
              { icon: "🎊", date: "Octubre — boda", title: "Resto pagos + sobres", amt: `+${fmt(regalosMin)} regalos`, color: C.teal },
              { icon: "✅", date: "Tras la boda", title: "Devolver préstamo(s)", amt: `–${fmt(prestamoTotal)} · sobran ${fmt(scBase)}`, color: C.green },
            ].map((s, i) => (
              <div key={i} style={{ display: "flex", gap: 12, paddingBottom: i < 4 ? 14 : 0, alignItems: "flex-start" }}>
                <div style={{ width: 32, height: 32, borderRadius: "50%", background: C.grayLight, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, flexShrink: 0 }}>{s.icon}</div>
                <div>
                  <div style={{ fontSize: 10, color: C.sub, fontWeight: 600, textTransform: "uppercase", letterSpacing: ".5px" }}>{s.date}</div>
                  <div style={{ fontSize: 13, fontWeight: 600 }}>{s.title}</div>
                  <div style={{ fontSize: 13, fontWeight: 700, color: s.color }}>{s.amt}</div>
                </div>
              </div>
            ))}
          </div>
          <div>
            <div style={{ fontSize: 12, color: C.sub, marginBottom: 8 }}>Coste de la luna de miel</div>
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 4 }}>
              <input type="range" min={9848} max={9848} step={1} value={luna} disabled onChange={(e) => setLuna(+e.target.value)} style={{ flex: 1, accentColor: C.purple, opacity: 0.5 }} />
              <span style={{ fontSize: 15, fontWeight: 700, color: C.purple, minWidth: 62, textAlign: "right" }}>{fmt(luna)}</span>
            </div>
            <div style={{ fontSize: 11, color: C.sub, marginBottom: 16 }}>Ya pagados {fmt(2000)} de señal · Coste final confirmado {fmt(9848)}</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
              <div style={{ background: C.tealLight, borderRadius: 10, padding: "13px 15px" }}>
                <div style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", color: C.teal, marginBottom: 4 }}>Superávit (con préstamo devuelto)</div>
                <div style={{ fontSize: 21, fontWeight: 700, color: C.teal }}>{fmt(scBase)}</div>
                <div style={{ fontSize: 11, color: C.sub }}>{nAdultos} adultos × {fmt(180)} – préstamo</div>
              </div>
              <div style={{ background: C.amberLight, borderRadius: 10, padding: "13px 15px" }}>
                <div style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", color: C.amber, marginBottom: 4 }}>Conservador (sin descontar préstamo)</div>
                <div style={{ fontSize: 21, fontWeight: 700, color: C.amber }}>{fmt(scCons)}</div>
                <div style={{ fontSize: 11, color: C.sub }}>Ya no hay margen de ahorro: el coste está confirmado</div>
              </div>
            </div>
            <div style={{ marginTop: 12, padding: "10px 14px", background: C.grayLight, borderRadius: 8, fontSize: 12, color: C.sub }}>
              <strong style={{ color: C.text }}>Todos los escenarios devuelven íntegros tanto el préstamo de los padres ({fmt(debePadres)}) como el adicional, si hiciera falta.</strong> Los KPIs se recalculan automáticamente al editar gastos, pagos o invitados.
            </div>
          </div>
        </div>
      </Card>

      <Card title="📅 Próximos hitos de pago">
        {PAGOS_HITOS.map((p, i) => {
          // El importe del préstamo adicional y del resto de catering se recalculan en vivo (KPI
          // "Préstamo adicional necesario" y pendiente real de Catering) en vez de quedarse fijos en el
          // valor con el que se calcularon por primera vez estos hitos.
          const importe = p.hito === "Préstamo adicional (si hace falta)" ? gap
            : p.hito === "Resto catering + confirmar invitados" ? restoCatering
            : p.importe;
          const colors = { purple: [C.purpleLight, C.purple], amber: [C.amberLight, C.amber], red: [C.redLight, C.red] };
          const [bg, fg] = colors[p.tipo];
          return (
            <div key={i} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 12px", background: bg, borderRadius: 8, borderLeft: `3px solid ${fg}`, marginBottom: 8 }}>
              <div>
                <div style={{ fontSize: 13, fontWeight: 600 }}>{p.hito}</div>
                <div style={{ fontSize: 11, color: C.sub }}>{p.fecha}</div>
              </div>
              <div style={{ fontSize: 15, fontWeight: 700, color: fg }}>{fmt(importe)}</div>
            </div>
          );
        })}
      </Card>
    </div>
  );
}

// ─────────────────────────────────────────────────────────
// Panel de devoluciones — dentro de la tarjeta "Pendiente de devolver": una fila por cada deudor
// (Iván, Marga, Padres) con lo que aún se le debe, un botón para ir registrando devoluciones parciales
// (no hace falta devolverlo todo de golpe) y el historial de lo ya devuelto a cada uno.
// ─────────────────────────────────────────────────────────
function DevolucionesPanel({ deudas, devoluciones, setDevoluciones }) {
  const [abiertoPara, setAbiertoPara] = useState(null); // "Iván" | "Marga" | "Padres" | null
  const [draft, setDraft] = useState({ cantidad: "", fecha: "", comentario: "" });

  const abrir = (quien) => { setAbiertoPara(quien); setDraft({ cantidad: "", fecha: "", comentario: "" }); };
  const guardar = (quien) => {
    const cantidad = +draft.cantidad || 0;
    if (cantidad <= 0) return;
    const nueva = { id: "dev_" + Date.now(), quien, cantidad, fecha: draft.fecha || "", comentario: draft.comentario || "" };
    setDevoluciones([...(devoluciones || []), nueva]);
    setAbiertoPara(null);
  };
  const borrar = (id) => setDevoluciones((devoluciones || []).filter((d) => d.id !== id));

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
      {DEUDORES.filter((q) => deudas[q] > 0.5).map((quien) => {
        const historial = (devoluciones || []).filter((d) => d.quien === quien);
        return (
          <div key={quien} style={{ background: C.card, borderRadius: 8, padding: "9px 12px" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, flexWrap: "wrap" }}>
              <div style={{ fontSize: 13 }}>
                {quien === "Padres" ? "👪" : "👤"} <strong>{quien === "Padres" ? "Préstamo padres" : quien}</strong> — se le debe <strong style={{ color: C.amber }}>{fmt(deudas[quien])}</strong>
              </div>
              <Btn small onClick={() => abrir(quien)}>+ Registrar devolución</Btn>
            </div>
            {abiertoPara === quien && (
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginTop: 8 }}>
                <Input placeholder="Cantidad €" type="number" value={draft.cantidad} onChange={(v) => setDraft({ ...draft, cantidad: v })} style={{ width: 110 }} />
                <Input placeholder="Fecha" type="date" value={draft.fecha} onChange={(v) => setDraft({ ...draft, fecha: v })} style={{ width: 150 }} />
                <Input placeholder="Comentario (opcional)" value={draft.comentario} onChange={(v) => setDraft({ ...draft, comentario: v })} style={{ flex: 1, minWidth: 140 }} />
                <Btn small variant="primary" onClick={() => guardar(quien)}>Guardar</Btn>
                <Btn small variant="ghost" onClick={() => setAbiertoPara(null)}>✕</Btn>
              </div>
            )}
            {historial.length > 0 && (
              <div style={{ marginTop: 8, fontSize: 11, color: C.sub }}>
                {historial.map((d) => (
                  <div key={d.id} style={{ display: "flex", alignItems: "center", gap: 6, padding: "2px 0" }}>
                    <span>✅ {fmt(d.cantidad)}{d.fecha ? ` · ${d.fecha}` : ""}{d.comentario ? ` · ${d.comentario}` : ""}</span>
                    <button onClick={() => borrar(d.id)} style={{ border: "none", background: "none", cursor: "pointer", color: C.red, fontSize: 11, padding: 0 }} title="Eliminar esta devolución">🗑</button>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ─────────────────────────────────────────────────────────
// Pagos de una partida — desplegable dentro de la fila del gasto. Ya no hay una pestaña "Registro"
// aparte: como todo pago está enlazado a una partida, se ve y se gestiona aquí mismo.
// ─────────────────────────────────────────────────────────
function PagosDePartida({ gasto, pagos, setPagos, guests, familias }) {
  const [adding, setAdding] = useState(false);
  const [newP, setNewP] = useState({ concepto: "", cantidad: "", fecha: "", metodo: "Transferencia", cuenta: "BBVA Boda", comentario: "", situacion: "Planificado", quien: "" });
  const [editP, setEditP] = useState(null);
  const [draftP, setDraftP] = useState({});

  const esIngreso = gasto.tipo === "ingreso";
  // Opciones combinadas de "quién lo regala": invitados sueltos + familias, con búsqueda predictiva.
  const opcionesQuien = esIngreso ? [
    { value: "", label: "Sin especificar" },
    ...(familias || []).map((f) => ({ value: `familia:${f.id}`, label: `👪 ${f.nombre}` })),
    ...(guests || []).map((g) => ({ value: `guest:${g.id}`, label: g.n })),
  ] : [];

  const propios = pagos.filter((p) => p.partida === gasto.id).sort((a, b) => (a.fecha || "").localeCompare(b.fecha || ""));

  const addPago = () => {
    if (!newP.concepto.trim()) return;
    setPagos([...pagos, { ...newP, cantidad: +newP.cantidad || 0, partida: gasto.id, id: "pago_" + Date.now() }]);
    setNewP({ concepto: "", cantidad: "", fecha: "", metodo: "Transferencia", cuenta: "BBVA Boda", comentario: "", situacion: "Planificado", quien: "" });
    setAdding(false);
  };
  const savePago = () => {
    setPagos(pagos.map((p) => (p.id === editP ? { ...draftP, cantidad: +draftP.cantidad || 0, partida: gasto.id } : p)));
    setEditP(null);
  };
  const delPago = (id) => { if (confirm("¿Eliminar este pago?")) setPagos(pagos.filter((p) => p.id !== id)); };
  const setSituacionPago = (id, val) => setPagos(pagos.map((p) => (p.id === id ? { ...p, situacion: val } : p)));

  return (
    <div style={{ padding: "10px 14px 14px", background: C.grayLight }}>
      <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 8 }}>
        <Btn small variant="primary" onClick={() => setAdding(!adding)}>{adding ? "Cancelar" : `+ Pago en «${gasto.c}»`}</Btn>
      </div>

      {adding && (
        <Card style={{ marginBottom: 10, background: C.rosePale }}>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
            <Input placeholder="Concepto" value={newP.concepto} onChange={(v) => setNewP({ ...newP, concepto: v })} style={{ flex: 2, minWidth: 140 }} />
            <Input placeholder="€" type="number" value={newP.cantidad} onChange={(v) => setNewP({ ...newP, cantidad: v })} style={{ width: 90 }} />
            <Input type="date" value={newP.fecha} onChange={(v) => setNewP({ ...newP, fecha: v })} style={{ width: 150 }} />
            <Select value={newP.metodo} onChange={(v) => setNewP({ ...newP, metodo: v })} options={METODOS} />
            <Select value={newP.cuenta} onChange={(v) => setNewP({ ...newP, cuenta: v })} options={CUENTAS} />
            <Select value={newP.situacion} onChange={(v) => setNewP({ ...newP, situacion: v })} options={SITUACION_PAGO_OPTS} />
            {esIngreso && (
              <SelectBuscable value={newP.quien} onChange={(v) => setNewP({ ...newP, quien: v })} placeholder="¿Quién lo regala?" options={opcionesQuien} style={{ width: 180 }} />
            )}
            <Input placeholder="Comentario" value={newP.comentario} onChange={(v) => setNewP({ ...newP, comentario: v })} style={{ flex: 1, minWidth: 120 }} />
            <Btn variant="primary" onClick={addPago}>Guardar</Btn>
          </div>
        </Card>
      )}

      {propios.length === 0 ? (
        <div style={{ fontSize: 12, color: C.sub, padding: "4px 2px" }}>Todavía no hay ningún pago registrado en esta partida.</div>
      ) : (
        <Card style={{ padding: 0, overflow: "hidden" }}>
          <div className="boda-scroll-x" style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 620 }}>
              <thead>
                <tr>
                  {(esIngreso ? ["Concepto", "Cantidad", "Fecha", "Método", "Cuenta", "¿Quién lo regala?", "Situación", "Estado", ""] : ["Concepto", "Cantidad", "Fecha", "Método", "Cuenta", "Situación", "Estado", ""]).map((h) => (
                    <th key={h} style={{ fontSize: 10, fontWeight: 600, textTransform: "uppercase", letterSpacing: ".5px", color: C.sub, textAlign: "left", padding: "8px 10px", borderBottom: `1px solid ${C.grayMid}`, background: C.card }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {propios.map((p) => {
                  const persona = cuentaPersona(p.cuenta);
                  const isEd = editP === p.id;
                  if (isEd) {
                    return (
                      <tr key={p.id} style={{ background: C.rosePale }}>
                        <td style={{ padding: "6px 10px" }}><Input value={draftP.concepto} onChange={(v) => setDraftP({ ...draftP, concepto: v })} style={{ width: 140 }} /></td>
                        <td style={{ padding: "6px 10px" }}><Input type="number" value={draftP.cantidad} onChange={(v) => setDraftP({ ...draftP, cantidad: v })} style={{ width: 80 }} /></td>
                        <td style={{ padding: "6px 10px" }}><Input type="date" value={draftP.fecha} onChange={(v) => setDraftP({ ...draftP, fecha: v })} style={{ width: 130 }} /></td>
                        <td style={{ padding: "6px 10px" }}><Select value={draftP.metodo} onChange={(v) => setDraftP({ ...draftP, metodo: v })} options={METODOS} /></td>
                        <td style={{ padding: "6px 10px" }}><Select value={draftP.cuenta} onChange={(v) => setDraftP({ ...draftP, cuenta: v })} options={CUENTAS} /></td>
                        {esIngreso && (
                          <td style={{ padding: "6px 10px" }}>
                            <SelectBuscable value={draftP.quien || ""} onChange={(v) => setDraftP({ ...draftP, quien: v })} placeholder="¿Quién lo regala?" options={opcionesQuien} style={{ width: 170 }} />
                          </td>
                        )}
                        <td style={{ padding: "6px 10px" }}><Select value={draftP.situacion || "Realizado"} onChange={(v) => setDraftP({ ...draftP, situacion: v })} options={SITUACION_PAGO_OPTS} /></td>
                        <td />
                        <td style={{ padding: "6px 10px", whiteSpace: "nowrap" }}>
                          <Btn small variant="primary" onClick={savePago} style={{ marginRight: 4 }}>✓</Btn>
                          <Btn small variant="ghost" onClick={() => setEditP(null)}>✕</Btn>
                        </td>
                      </tr>
                    );
                  }
                  const situacion = p.situacion || "Realizado";
                  const esPlanificado = situacion === "Planificado";
                  const q = parseQuien(p.quien);
                  const quienTxt = q ? (q.tipo === "familia" ? `👪 ${familiaLabel(familias, q.id)}` : ((guests || []).find((x) => x.id === q.id) || {}).n) : null;
                  return (
                    <tr key={p.id} style={esPlanificado ? { background: C.amberLight } : undefined}>
                      <td style={{ padding: "8px 10px", borderBottom: `1px solid ${C.grayMid}`, fontWeight: 500, fontSize: 12 }}>
                        {p.concepto}
                        {p.comentario && <div style={{ fontSize: 10, color: C.sub }}>{p.comentario}</div>}
                      </td>
                      <td style={{ padding: "8px 10px", borderBottom: `1px solid ${C.grayMid}`, fontSize: 12, fontWeight: 600 }}>{fmt(p.cantidad)}</td>
                      <td style={{ padding: "8px 10px", borderBottom: `1px solid ${C.grayMid}`, fontSize: 12, color: C.sub }}>{fmtFecha(p.fecha)}</td>
                      <td style={{ padding: "8px 10px", borderBottom: `1px solid ${C.grayMid}`, fontSize: 12 }}>{p.metodo}</td>
                      <td style={{ padding: "8px 10px", borderBottom: `1px solid ${C.grayMid}`, fontSize: 12 }}>{p.cuenta}</td>
                      {esIngreso && (
                        <td style={{ padding: "8px 10px", borderBottom: `1px solid ${C.grayMid}` }}>
                          {quienTxt ? <Badge color="rose">🎁 {quienTxt}</Badge> : <span style={{ fontSize: 11, color: C.sub, fontStyle: "italic" }}>Sin especificar</span>}
                        </td>
                      )}
                      <td style={{ padding: "8px 10px", borderBottom: `1px solid ${C.grayMid}`, whiteSpace: "nowrap" }}>
                        <button onClick={() => setSituacionPago(p.id, esPlanificado ? "Realizado" : "Planificado")} title={esPlanificado ? "Marcar como ya realizado" : "Marcar como solo planificado"} style={{ cursor: "pointer", border: "none", borderRadius: 20, padding: "3px 8px", fontSize: 10, fontWeight: 600, background: esPlanificado ? C.amber : C.greenLight, color: esPlanificado ? "#fff" : C.green }}>
                          {esPlanificado ? "🕓 Planificado" : "✅ Realizado"}
                        </button>
                      </td>
                      <td style={{ padding: "8px 10px", borderBottom: `1px solid ${C.grayMid}` }}>
                        {persona ? <Badge color="amber">↩ Devolver a {persona}</Badge> : <Badge color="teal">Cuenta boda</Badge>}
                      </td>
                      <td style={{ padding: "8px 10px", borderBottom: `1px solid ${C.grayMid}`, whiteSpace: "nowrap" }}>
                        <Btn small variant="ghost" onClick={() => { setEditP(p.id); setDraftP({ ...p }); }} style={{ marginRight: 2 }}>✏️</Btn>
                        <Btn small variant="ghost" onClick={() => delPago(p.id)}>🗑</Btn>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </Card>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────
// TAB: GASTOS (editable) — incluye los pagos (desplegando cada partida) y los ingresos (p.ej. Regalos)
// ─────────────────────────────────────────────────────────
function TabGastos({ gastos, setGastos, pagos, setPagos, devoluciones, setDevoluciones, guests, familias }) {
  const [editing, setEditing] = useState(null); // id being edited
  const [draft, setDraft] = useState({});
  const [adding, setAdding] = useState(false);
  const [newG, setNewG] = useState({ c: "", total: "", tipo: "gasto" });
  const [expanded, setExpanded] = useState({}); // { [gastoId]: true }

  const paidMap = pagadoPorPartida(pagos);        // #1 pagado real por partida
  const paidOf = (g) => paidMap[g.id] || 0;

  // Las partidas de tipo "ingreso" (p.ej. "Regalos") no son un gasto a cubrir — no cuentan en el
  // presupuesto/pagado de arriba, se muestran aparte más abajo.
  const gastosNormales = gastos.filter((g) => g.tipo !== "ingreso");
  const ingresos = gastos.filter((g) => g.tipo === "ingreso");

  const totalT = gastosNormales.reduce((s, g) => s + g.total, 0);
  const totalP = gastosNormales.reduce((s, g) => s + paidOf(g), 0);
  const totalIngresos = ingresos.reduce((s, g) => s + paidOf(g), 0);

  // Pendientes de devolver: pagos hechos desde cuentas personales (Trade Republic Iván / Caixa Marga)
  // o con el préstamo de los padres, en vez de la cuenta compartida BBVA Boda — antes se veía en la
  // pestaña Registro, ahora aquí mismo. Se descuenta lo que ya se haya ido devolviendo (registro aparte
  // "devoluciones", para poder ir saldando la deuda poco a poco sin tocar el registro de pagos).
  const pendientes = pagos.filter((p) => cuentaPersona(p.cuenta));
  const debeBruto = (quien) => pendientes.filter((p) => cuentaPersona(p.cuenta) === quien).reduce((s, p) => s + (+p.cantidad || 0), 0);
  const devueltoA = (quien) => (devoluciones || []).filter((d) => d.quien === quien).reduce((s, d) => s + (+d.cantidad || 0), 0);
  const debeIvan = Math.max(0, debeBruto("Iván") - devueltoA("Iván"));
  const debeMarga = Math.max(0, debeBruto("Marga") - devueltoA("Marga"));
  const debePadres = Math.max(0, debeBruto("Padres") - devueltoA("Padres"));
  const totalPend = debeIvan + debeMarga + debePadres;
  const totalPlanificado = pagos.filter((p) => (p.situacion || "Realizado") === "Planificado").reduce((s, p) => s + (+p.cantidad || 0), 0);

  const toggleExpand = (id) => setExpanded((e) => ({ ...e, [id]: !e[id] }));

  const startEdit = (g) => { setEditing(g.id); setDraft({ total: g.total }); };
  const saveEdit = (id) => {
    setGastos(gastos.map((g) => g.id === id ? { ...g, total: +draft.total || 0 } : g));
    setEditing(null);
  };
  const removeG = (id) => {
    if (confirm("¿Eliminar esta partida? Los pagos que tenga enlazados no se borran, se quedan sin partida.")) {
      setGastos(gastos.filter((g) => g.id !== id));
    }
  };
  const addG = () => {
    if (!newG.c.trim()) return;
    const item = { id: "g" + Date.now(), c: newG.c.trim(), total: +newG.total || 0, paid: 0, estado: "Pendiente" };
    if (newG.tipo === "ingreso") item.tipo = "ingreso";
    setGastos([...gastos, item]);
    setNewG({ c: "", total: "", tipo: "gasto" });
    setAdding(false);
  };

  const renderFilaGasto = (g, esIngreso) => {
    const paid = paidOf(g);
    const pend = g.total - paid;
    const pctP = g.total > 0 ? Math.min(100, (paid / g.total) * 100) : 0;
    const nPagos = pagos.filter((p) => p.partida === g.id).length;
    const isEd = editing === g.id;
    const isExp = !!expanded[g.id];
    return (
      <React.Fragment key={g.id}>
        <tr>
          <td style={{ padding: "10px 12px", borderBottom: `1px solid ${C.grayLight}`, fontWeight: 500, fontSize: 13 }}>
            <button onClick={() => toggleExpand(g.id)} style={{ border: "none", background: "none", cursor: "pointer", marginRight: 6, color: C.sub, fontSize: 11, padding: 0 }} title="Ver / añadir pagos">
              {isExp ? "▾" : "▸"}
            </button>
            {g.c}
            {nPagos > 0 && <span style={{ fontSize: 10, color: C.sub, marginLeft: 6 }}>· {nPagos} pago{nPagos > 1 ? "s" : ""}</span>}
          </td>
          <td style={{ padding: "10px 12px", borderBottom: `1px solid ${C.grayLight}`, fontSize: 13, fontWeight: 600 }}>
            {isEd ? <Input type="number" value={draft.total} onChange={(v) => setDraft({ ...draft, total: v })} style={{ width: 90 }} /> : (g.total > 0 ? fmt(g.total) : (esIngreso ? "—" : fmt(0)))}
          </td>
          <td style={{ padding: "10px 12px", borderBottom: `1px solid ${C.grayLight}`, fontSize: 13, color: C.teal, fontWeight: 500 }}>
            {fmt(paid)}
          </td>
          <td style={{ padding: "10px 12px", borderBottom: `1px solid ${C.grayLight}`, fontSize: 13, color: pend > 0 ? C.red : C.green }}>
            {g.total <= 0 ? "—" : (pend > 0.5 ? fmt(pend) : "✓ Completo")}
          </td>
          <td style={{ padding: "10px 12px", borderBottom: `1px solid ${C.grayLight}`, minWidth: 110 }}>
            {g.total > 0 ? (
              <div style={{ height: 7, background: C.grayLight, borderRadius: 4, overflow: "hidden" }}>
                <div style={{ width: pctP + "%", height: "100%", background: pctP >= 100 ? C.teal : pctP > 0 ? C.amber : C.grayLight, transition: "width .3s" }} />
              </div>
            ) : <span style={{ fontSize: 11, color: C.sub }}>Sin objetivo fijo</span>}
          </td>
          <td style={{ padding: "10px 12px", borderBottom: `1px solid ${C.grayLight}`, whiteSpace: "nowrap" }}>
            {isEd ? (
              <>
                <Btn small variant="primary" onClick={() => saveEdit(g.id)} style={{ marginRight: 4 }}>Guardar</Btn>
                <Btn small variant="ghost" onClick={() => setEditing(null)}>✕</Btn>
              </>
            ) : (
              <>
                <Btn small onClick={() => startEdit(g)} style={{ marginRight: 4 }}>✏️ Total</Btn>
                <Btn small variant="danger" onClick={() => removeG(g.id)}>🗑</Btn>
              </>
            )}
          </td>
        </tr>
        {isExp && (
          <tr>
            <td colSpan={6} style={{ padding: 0, borderBottom: `1px solid ${C.grayMid}` }}>
              <PagosDePartida gasto={g} pagos={pagos} setPagos={setPagos} guests={guests} familias={familias} />
            </td>
          </tr>
        )}
      </React.Fragment>
    );
  };

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(140px,1fr))", gap: 12, marginBottom: 16 }}>
        <KPI label="Total presupuesto" value={fmt(totalT)} color={C.rose} />
        <KPI label="Pagado" value={fmt(totalP)} sub={`${((totalP / totalT) * 100).toFixed(1)}%`} color={C.teal} />
        <KPI label="Pendiente" value={fmt(totalT - totalP)} color={C.red} />
        <KPI label="Partidas" value={gastosNormales.length} color={C.blue} />
        <KPI label="Pendiente devolver" value={fmt(totalPend)} sub={`${pendientes.length} pagos personales`} color={C.amber} />
      </div>

      <div style={{ padding: "9px 13px", background: C.blueLight, borderRadius: 8, fontSize: 12, color: C.blue, marginBottom: 12, display: "flex", alignItems: "center", gap: 6 }}>
        <span>🔗</span><span>El <strong>pagado</strong> de cada partida se calcula desde sus propios pagos. Para ver o añadir un pago, despliega la partida con la flechita ▸.</span>
      </div>

      {totalPlanificado > 0 && (
        <Card style={{ marginBottom: 14, background: C.amberLight, border: `1px solid ${C.amber}33` }}>
          <div style={{ fontSize: 13, color: C.amber }}>
            <strong>🕓 Escenario activo:</strong> {fmt(totalPlanificado)} son pagos <em>planificados</em> (aún no hechos de verdad) que ya se están contando en la hucha y en el préstamo necesario, para que puedas ver el efecto antes de decidir. Márcalos como "✅ Realizado" en cuanto los hagáis de verdad, o bórralos si al final no seguís ese plan.
          </div>
        </Card>
      )}

      {totalPend > 0 && (
        <Card style={{ marginBottom: 14, background: C.amberLight, border: `1px solid ${C.amber}33` }}>
          <div style={{ fontSize: 13, color: C.amber, marginBottom: 10 }}>
            <strong>💡 Pendiente de devolver:</strong> {fmt(totalPend)} pagados desde cuentas personales o con préstamos que la hucha boda debe reembolsar. Los pagos desde <em>BBVA Boda</em> ya salieron de la hucha común.
          </div>
          <DevolucionesPanel
            deudas={{ Iván: debeIvan, Marga: debeMarga, Padres: debePadres }}
            devoluciones={devoluciones}
            setDevoluciones={setDevoluciones}
          />
        </Card>
      )}

      <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 10 }}>
        <Btn variant="primary" onClick={() => setAdding(!adding)}>{adding ? "Cancelar" : "+ Añadir partida"}</Btn>
      </div>

      {adding && (
        <Card style={{ marginBottom: 12, background: C.rosePale }}>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
            <Input placeholder="Concepto" value={newG.c} onChange={(v) => setNewG({ ...newG, c: v })} style={{ flex: 2, minWidth: 140 }} />
            <Input placeholder="Total € (opcional si es ingreso)" type="number" value={newG.total} onChange={(v) => setNewG({ ...newG, total: v })} style={{ width: 170 }} />
            <Select value={newG.tipo} onChange={(v) => setNewG({ ...newG, tipo: v })} options={[{ value: "gasto", label: "💳 Gasto" }, { value: "ingreso", label: "💰 Ingreso" }]} />
            <Btn variant="primary" onClick={addG}>Guardar</Btn>
          </div>
        </Card>
      )}

      <Card style={{ padding: 0, overflow: "hidden", marginBottom: ingresos.length ? 16 : 0 }}>
        <div className="boda-scroll-x" style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead>
              <tr>
                {["Concepto", "Total", "Pagado", "Pendiente", "Progreso", "Acciones"].map((h) => (
                  <th key={h} style={{ fontSize: 11, fontWeight: 600, textTransform: "uppercase", letterSpacing: ".5px", color: C.sub, textAlign: "left", padding: "10px 12px", borderBottom: `1px solid ${C.grayMid}`, background: C.grayLight }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {gastosNormales.map((g) => renderFilaGasto(g, false))}
              <tr>
                <td style={{ padding: "12px", fontWeight: 700, background: C.grayLight }}>TOTAL</td>
                <td style={{ padding: "12px", fontWeight: 700, background: C.grayLight }}>{fmt(totalT)}</td>
                <td style={{ padding: "12px", fontWeight: 700, background: C.grayLight, color: C.teal }}>{fmt(totalP)}</td>
                <td style={{ padding: "12px", fontWeight: 700, background: C.grayLight, color: C.red }}>{fmt(totalT - totalP)}</td>
                <td colSpan={2} style={{ background: C.grayLight }}></td>
              </tr>
            </tbody>
          </table>
        </div>
      </Card>

      {ingresos.length > 0 && (
        <Card title="💰 Ingresos extra (no son un gasto — suman a la hucha en vez de restar)" style={{ padding: 0, overflow: "hidden" }}>
          <div className="boda-scroll-x" style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse" }}>
              <thead>
                <tr>
                  {["Concepto", "Objetivo", "Recibido", "Pendiente", "Progreso", "Acciones"].map((h) => (
                    <th key={h} style={{ fontSize: 11, fontWeight: 600, textTransform: "uppercase", letterSpacing: ".5px", color: C.sub, textAlign: "left", padding: "10px 12px", borderBottom: `1px solid ${C.grayMid}`, background: C.grayLight }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {ingresos.map((g) => renderFilaGasto(g, true))}
                <tr>
                  <td style={{ padding: "12px", fontWeight: 700, background: C.grayLight }}>TOTAL RECIBIDO</td>
                  <td style={{ background: C.grayLight }} />
                  <td style={{ padding: "12px", fontWeight: 700, background: C.grayLight, color: C.teal }}>{fmt(totalIngresos)}</td>
                  <td colSpan={3} style={{ background: C.grayLight }} />
                </tr>
              </tbody>
            </table>
          </div>
        </Card>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────
// TAB: INVITADOS (editable)
// ─────────────────────────────────────────────────────────
const MENU_OPTS = ["Adulto", "Niño", "Celiaco", "Pescetariano", "Pescado/Marisco", "Nueces y semillas de amapola", "Ou", "No"];
const CONF_OPTS = [
  { value: "Si", label: "Confirmado" },
  { value: "No", label: "No viene" },
  { value: "", label: "Pendiente" },
];
// Cómo se obtuvo/actualizó la confirmación de este invitado: por el formulario RSVP del cuestionario,
// o manualmente (WhatsApp, llamada, etc.). Útil para saber a quién le falta pasar por el formulario de verdad.
const ORIGEN_OPTS = [
  { value: "Formulario", label: "📋 Formulario RSVP" },
  { value: "Manual", label: "✍️ Manual / otro" },
  { value: "", label: "Sin especificar" },
];
const origenBadge = (o) => o === "Formulario" ? { icon: "📋", label: "Formulario RSVP" } : o === "Manual" ? { icon: "✍️", label: "Manual / otro" } : { icon: "–", label: "Sin especificar" };
// Menús "estándar" (sin restricción especial) para colorear
const menuColor = (c) => {
  if (c === "Niño") return "amber";
  if (c === "No") return "gray";
  if (c === "Adulto") return "teal";
  return "red"; // cualquier restricción alimentaria
};
const confBadge = (c) => c === "Si" ? { color: "green", label: "✓ Sí" } : c === "No" ? { color: "red", label: "✕ No" } : { color: "gray", label: "Pendiente" };

function TabInvitados({ guests, setGuests, familias, setFamilias, pagos, gastos }) {
  const [q, setQ] = useState("");
  const [fMesa, setFMesa] = useState("");
  const [fCom, setFCom] = useState("");
  const [fDesp, setFDesp] = useState("");
  const [fConf, setFConf] = useState("");
  const [fFam, setFFam] = useState("");
  const [fOrigen, setFOrigen] = useState("");
  const [fRegalo, setFRegalo] = useState("");
  const [adding, setAdding] = useState(false);
  const [newG, setNewG] = useState({ n: "", sex: "Mujer", comida: "Adulto", desp: "Ninguna", mesa: "", confirmado: "" });
  const [editing, setEditing] = useState(null);
  const [draft, setDraft] = useState({});
  const [gestionandoFamilias, setGestionandoFamilias] = useState(false);
  const [nuevaFamilia, setNuevaFamilia] = useState("");
  const [nuevaFamiliaMiembros, setNuevaFamiliaMiembros] = useState([]); // ids seleccionados antes de crear
  const [nuevaFamiliaQuery, setNuevaFamiliaQuery] = useState("");
  const [editingFamilia, setEditingFamilia] = useState(null); // id de familia en edición de nombre
  const [draftFamiliaNombre, setDraftFamiliaNombre] = useState("");
  const [addingMemberTo, setAddingMemberTo] = useState(null); // id de familia a la que se le está añadiendo un miembro
  const [memberQuery, setMemberQuery] = useState("");

  const mesas = useMemo(() => [...new Set(guests.map((g) => g.mesa).filter(Boolean))].sort((a, b) => a - b), [guests]);
  const menusEnUso = useMemo(() => [...new Set(guests.map((g) => g.comida))], [guests]);
  const familiasEnUso = useMemo(() => [...new Set(guests.map((g) => g.familia).filter(Boolean))].sort(), [guests]);
  const regalos = useMemo(() => regalosPorInvitado(guests, pagos || [], gastos || []), [guests, pagos, gastos]);
  const nConRegalo = useMemo(() => guests.filter((g) => regalos[g.id] > 0).length, [guests, regalos]);

  const miembrosDe = (famId) => guests.filter((g) => g.familia === famId);

  const toggleNuevaFamiliaMiembro = (id) => {
    setNuevaFamiliaMiembros((cur) => (cur.includes(id) ? cur.filter((x) => x !== id) : [...cur, id]));
  };
  const crearFamilia = () => {
    const nombre = nuevaFamilia.trim();
    if (!nombre) return;
    const id = nextFamiliaId(familias);
    setFamilias([...familias, { id, nombre }]);
    if (nuevaFamiliaMiembros.length > 0) {
      setGuests(guests.map((g) => (nuevaFamiliaMiembros.includes(g.id) ? { ...g, familia: id } : g)));
    }
    setNuevaFamilia("");
    setNuevaFamiliaMiembros([]);
    setNuevaFamiliaQuery("");
  };
  const startEditFamilia = (f) => { setEditingFamilia(f.id); setDraftFamiliaNombre(f.nombre); };
  const saveEditFamilia = () => {
    const nombre = draftFamiliaNombre.trim();
    if (nombre) setFamilias(familias.map((f) => (f.id === editingFamilia ? { ...f, nombre } : f)));
    setEditingFamilia(null);
  };
  const eliminarFamilia = (famId) => {
    const n = miembrosDe(famId).length;
    if (n > 0 && !confirm(`Esta familia tiene ${n} invitado${n > 1 ? "s" : ""} asignado${n > 1 ? "s" : ""}. Se quedarán sin familia. ¿Eliminar de todas formas?`)) return;
    setFamilias(familias.filter((f) => f.id !== famId));
    if (n > 0) setGuests(guests.map((g) => (g.familia === famId ? { ...g, familia: "" } : g)));
  };
  const asignarFamilia = (guestId, famId) => setGuests(guests.map((g) => (g.id === guestId ? { ...g, familia: famId || "" } : g)));
  const quitarDeFamilia = (guestId) => asignarFamilia(guestId, "");

  // Mesas donde una misma familia queda repartida en más de una mesa — aviso útil antes de imprimir el plano
  const familiasRepartidas = useMemo(() => {
    const porFamilia = {};
    guests.forEach((g) => {
      if (!g.familia) return;
      if (!porFamilia[g.familia]) porFamilia[g.familia] = new Set();
      porFamilia[g.familia].add(g.mesa || 0);
    });
    return Object.entries(porFamilia).filter(([, mesasSet]) => mesasSet.size > 1).map(([fam]) => fam);
  }, [guests]);

  const filtered = guests.filter((g) => {
    if (q && !g.n.toLowerCase().includes(q.toLowerCase())) return false;
    if (fMesa && String(g.mesa) !== fMesa) return false;
    if (fCom && g.comida !== fCom) return false;
    if (fDesp && g.desp !== fDesp) return false;
    if (fFam && g.familia !== fFam) return false;
    if (fConf === "PEND" && g.confirmado) return false;
    if (fConf && fConf !== "PEND" && g.confirmado !== fConf) return false;
    if (fOrigen === "SIN" && (g.origen === "Formulario" || g.origen === "Manual")) return false;
    if (fOrigen && fOrigen !== "SIN" && g.origen !== fOrigen) return false;
    if (fRegalo === "CON" && !(regalos[g.id] > 0)) return false;
    if (fRegalo === "SIN" && regalos[g.id] > 0) return false;
    return true;
  });

  const nH = guests.filter((g) => g.sex === "Hombre").length;
  const nM = guests.filter((g) => g.sex === "Mujer").length;
  const nNinos = guests.filter((g) => g.comida === "Niño").length;
  const nRestr = guests.filter((g) => !["Adulto", "Niño", "No"].includes(g.comida)).length;
  const nSi = guests.filter((g) => g.confirmado === "Si").length;
  const nNo = guests.filter((g) => g.confirmado === "No").length;
